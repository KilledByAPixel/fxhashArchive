name: Weekly snapshot refresh
# Doubles as a liveness canary for the fxhash GraphQL API: when that API is
# retired for good, this job will start failing loudly (red X in Actions)
# while the committed snapshot in public/data stays exactly as it is. The
# site keeps serving the last-known-good catalog either way — only future
# refreshes stop.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to dispatch deploy.yml; see "Publish the refreshed catalog" below
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/snapshot.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: weekly snapshot refresh"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      # GitHub deliberately does not trigger workflows from pushes made with the
      # default GITHUB_TOKEN, so deploy.yml's `on: push` never fires for the commit
      # above. Without this step the refreshed catalog sits in the repo and never
      # reaches the live site — the weekly job would accomplish nothing visible.
      - name: Publish the refreshed catalog
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
