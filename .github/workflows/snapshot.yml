name: Weekly snapshot refresh
# Doubles as a liveness canary for the fxhash GraphQL API: when that API is
# retired for good, this job will start failing loudly (red X in Actions)
# while the committed snapshot in public/data stays exactly as it is. The
# site keeps serving the last-known-good catalog either way — only future
# refreshes stop.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: weekly snapshot refresh"
          git push
