<!doctype html>
<!--
  Source for public/live.html. Generated by scripts/build-runners.mjs, which
  substitutes the shim and the gateway allow-list; edit this file, never the
  generated one.

  ## What this is for

  A piece streamed from an IPFS gateway runs in the same opaque-origin sandbox as
  an archived one, so it hits the same four faults — tainted canvas, storage that
  throws, workers refused. But the fix for an archived piece is a script we insert
  into a file we own, and a gateway's document is not ours to edit. Nor can we
  reach into it afterwards: that is the origin boundary doing exactly its job.

  So this page manufactures a file we own. It runs at our origin, fetches the
  artifact, splices the shim in ahead of the artist's scripts, and writes the
  result into itself.

  ## Why not srcdoc

  Because the seed lives in the URL. An fxhash generator reads `?fxhash=` out of
  `window.location.search`, and a srcdoc document's URL is `about:srcdoc` — no
  query at all, so the snippet reads null and the piece crashes before it draws.
  This page is at a real URL we control, carrying the real query, which is the
  whole reason it takes this shape rather than the obvious one.

  ## What it is careful about

  `fxsrc` decides what gets fetched and executed, and it arrives in a URL anyone
  can write. It is checked against the gateway allow-list before anything happens,
  so this cannot be turned into a way to run arbitrary HTML under our domain.

  Every failure falls back by navigating straight to the artifact, which is exactly
  what the viewer did before this page existed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>fxhash viewer — live artwork</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  p { color: #888; font: 14px system-ui, sans-serif; padding: 1rem; }
</style>
</head>
<body>
<p id="status">Loading artwork…</p>
<script>
;(function () {
  var SHIM = '__SANDBOX_SHIM__'
  var ALLOWED_ORIGINS = '__GATEWAY_ORIGINS__'

  var params = new URLSearchParams(window.location.search)
  var artifact = params.get('fxsrc')

  // Everything except our own parameter, in the order the capture had it. This is
  // what the generator will see, and it carries fxhash, fxiteration and fxminter.
  params.delete('fxsrc')
  var passthrough = params.toString()
  var direct = artifact
    ? artifact + (passthrough ? '?' + passthrough : '') + window.location.hash
    : null

  /** Give up and load the artifact the plain way — the behaviour before this page. */
  function fallback(why) {
    if (!direct) {
      document.getElementById('status').textContent = 'No artwork was specified.'
      return
    }
    console.warn('live wrapper: ' + why + '; loading the artifact directly')
    window.location.replace(direct)
  }

  if (!artifact) return fallback('no fxsrc parameter')

  var origin
  try {
    origin = new URL(artifact).origin
  } catch (e) {
    return fallback('fxsrc is not a URL')
  }
  if (ALLOWED_ORIGINS.indexOf(origin) < 0) {
    // Refuse rather than fall back: an origin we do not recognise is not something
    // to load by another route.
    document.getElementById('status').textContent = 'That artwork host is not one this viewer knows.'
    return
  }

  /**
   * Splice `<base>` and the shim in immediately after the opening `<head>`.
   *
   * Position is the point — the shim patches prototypes and globals, so it has to
   * precede every script the artist wrote. Inserting rather than prepending is
   * also what keeps the doctype first: writing anything ahead of it would put the
   * document in quirks mode and change how the piece lays out.
   *
   * The same three fallbacks as scripts/runner-lib.mjs, for the same reason — a
   * lot of these files are hand-written and some have no <head> at all.
   */
  function splice(html) {
    var tag = '<base href="' + artifact.replace(/"/g, '&quot;') + '">\n<script>\n' + SHIM + '\n<\/script>\n'
    var head = /<head\b[^>]*>/i.exec(html)
    if (head) return html.slice(0, head.index + head[0].length) + '\n' + tag + html.slice(head.index + head[0].length)
    var htmlTag = /<html\b[^>]*>/i.exec(html)
    if (htmlTag) return html.slice(0, htmlTag.index + htmlTag[0].length) + '\n' + tag + html.slice(htmlTag.index + htmlTag[0].length)
    return tag + html
  }

  fetch(artifact)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return res.text()
    })
    .then(function (html) {
      // document.open() keeps this document's URL — and therefore its query, and
      // therefore the seed. It is the entry document's URL that wins, and we are
      // the entry document.
      document.open()
      document.write(splice(html))
      document.close()
    })
    .catch(function (err) {
      fallback(err && err.message ? err.message : 'fetch failed')
    })
})()
</script>
</body>
</html>
