<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The gallery — fxhash archive</title>
    <!-- A real file at /gallery/, so that address works on a plain static server:
         GitHub Pages, the offline archive, anywhere. It forwards into the hash
         route the app uses. Relative on purpose — this file never knows, and
         never needs to know, what it is hosted under. -->
    <meta http-equiv="refresh" content="0; url=../#/gallery" />
    <script>location.replace('../#/gallery')</script>
  </head>
  <body>
    <p><a href="../#/gallery">Walk the gallery</a></p>
  </body>
</html>
