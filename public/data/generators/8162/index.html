<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

//---------------------------------------------------------------------------------------------------
const characters ='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
function generateRandStr(length) {
    let result = ' ';
    const charactersLength = characters.length;
    for ( let i = 0; i < length; i++ ) {
        result += characters.charAt(Math.floor(Math.random() * charactersLength));
    }
    return result;
}
//---------------------------------------------------------------------------------------------------
function hashCode(str) {
  var hash = 0, i, chr; 
  if (str.length === 0) return hash;
  for (i=0; i<str.length; i++) {
    chr   = str.charCodeAt(i);
    hash  = ((hash << 5) - hash) + chr;
    hash |= 0; // Convert to 32bit integer
  }
  return hash;
};

var viewerHash=hashCode(viewerStr);

//---------------------------------------------------------------------------------------------------
function getBuffSize(Buff) {
    w_=Buff.width;
    h_=Buff.height;
    if(!Number.isFinite(parseInt(w_))) {
        if (w_.startsWith("x")) w_=Math.floor(canvas.width*parseFloat(w_.substring(1))+.5);
        else w_=canvas.width;
    } else {
        if(w_<0) w_=canvas.width;
    }
    if(!Number.isFinite(parseInt(h_))) {
        if (h_.startsWith("x")) h_=Math.floor(canvas.height*parseFloat(h_.substring(1))+.5);
        else h_=canvas.height;
    } else {
        if(h_<0) h_=canvas.height;
    }
    return {w:w_,h:h_};
}

//---------------------------------------------------------------------------------------------------
function resize() {
    var w_p = canvas.width;
    var h_p = canvas.height;
    var w_n = window.innerWidth;
    var h_n = window.innerHeight;
    if (!(typeof CanvWidthOverride  === 'undefined' || CanvWidthOverride  === null)) w_n = CanvWidthOverride;
    if (!(typeof CanvHeightOverride === 'undefined' || CanvHeightOverride === null)) h_n = CanvHeightOverride;

    // rescale mouse coords so relative screen position does not vary when switching resoltions
    var scX=w_n/w_p;
    var scY=h_n/h_p;
    mouse.allX*=scX; mouse.allY*=scY;
    mouse.relX*=scX; mouse.relY*=scY;
    mouse.smX *=scX; mouse.smY *=scY;
    mouse.x   *=scX; mouse.y   *=scY;

    canvas.width=w_n;
    canvas.height=h_n;

    for (bname in buffers) {
        var Buff=buffers[bname];
        if((!Number.isFinite(Buff.width) || !Number.isFinite(Buff.height) || Buff.width<0 || Buff.height<0) && Buff.fb!=null)
        {
            createFB(Buff, getBuffSize(Buff).w, getBuffSize(Buff).h);
        }
    }
    if(!AnimEnable) { if(startTime>0.) { startTime=Date.now()/1000.0-actTime; requestAnimationFrame(draw); } }
}

  function renderGeomBuffer(fb, w, h, shader, trinum, textures, texSizes, numPasses=1, passIdx=0, blendMode="none", depthTest=1) {

	 gl.enable(gl.DEPTH_TEST);
      else

      if (blendMode=="none") 
	 gl.disable(gl.BLEND);
      else {
	 gl.enable(gl.BLEND);
	 if(blendMode=='one__one')         gl.blendFunc(gl.ONE,gl.ONE);
         if(blendMode=='sa__one_minus_sa') gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
         if(blendMode=='sc__one_minus_sc') gl.blendFunc(gl.SRC_COLOR,gl.ONE_MINUS_SRC_COLOR);

          gl.uniform1i(gl.getUniformLocation(shader, "iChannel"+i), i);
          gl.activeTexture(gl.TEXTURE0+i);
          gl.bindTexture(gl.TEXTURE_2D,textures[i]);
          if(!use_webgl2)
             gl.uniform2f(gl.getUniformLocation(shader, "iChannel"+i+"Res"), texSizes[i].w, texSizes[i].h );
      }
      gl.uniform3f(gl.getUniformLocation(shader, "iResolution"), wc, hc, 0);
      gl.uniform1f(gl.getUniformLocation(shader, "iTime"), actTime);
      gl.uniform1f(gl.getUniformLocation(shader, "iTimeDelta"), actTimeDelta);
      gl.uniform1i(gl.getUniformLocation(shader, "iFrame"), frameCnt);
      gl.uniform4f(gl.getUniformLocation(shader, "iDate"), dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), dateObj.getSeconds()+dateObj.getMinutes()*60+dateObj.getHours()*3600);
      gl.uniform4f(gl.getUniformLocation(shader, "iDevOri"), deviceori.alpha, deviceori.beta, deviceori.gamma, deviceori.active);

      	  if(SmoothMouse>0.) {

             mouse.smY=(1.-SmoothMouse)*mouse.relY+SmoothMouse*mouse.smY;

             gl.uniform4f(gl.getUniformLocation(shader, "iMouse"), mouse.smX,mouse.smY,mouse.smX,mouse.smY);
          }

             gl.uniform4f(gl.getUniformLocation(shader, "iMouse"), mouse.relX,mouse.relY,mouse.relX,mouse.relY);

      }
      gl.uniform1i(gl.getUniformLocation(shader, "iNumPasses"), numPasses);

      gl.uniform1i(gl.getUniformLocation(shader, "iNumTriangles"), trinum);

  function loadShader(vertexShaderSource, fragmentShaderSource) {
      var vertexShader = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vertexShader, vertexShaderSource);
      gl.compileShader(vertexShader);
      {
        var error = gl.getShaderInfoLog(vertexShader);
        if (error.length > 0) {
            console.log('compile error: '+error);
            var lines=error.match(/ERROR: [0-9]+:([0-9]+)/);
            var lnum=parseInt(lines[1]);
            if (lines.length>1) {
               var src_snip = vertexShaderSource.split('\n').slice(lnum-2,lnum+3).join("\n");
               console.log('src: \n'+src_snip);
            }
            return null;
        }
      }

      var fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fragmentShader, fragmentShaderSource);
      gl.compileShader(fragmentShader);
      {
        var error = gl.getShaderInfoLog(fragmentShader);
        if (error.length > 0) {
            console.log('compile error: '+error);
            var lines=error.match(/ERROR: [0-9]+:([0-9]+)/);
            var lnum=parseInt(lines[1]);
            if (lines.length>1) {
               var src_snip = fragmentShaderSource.split('\n').slice(lnum-2,lnum+3).join("\n");
               console.log('src: \n'+src_snip);
            }
            return null;
        }
      }

      var program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      if ( !gl.getProgramParameter( program, gl.LINK_STATUS) ) {
          var error = gl.getProgramInfoLog(program);
          if (error.length > 0) {
              console.log('link error: '+error);
              return null;
          }
      }
      return program;
  }

var myrnd_w = 123456789;
var myrnd_z = 987654321;

// Takes any integer
function myseed(i) {
    myrnd_w = (123456789 + i) & 0xffffffff;
    myrnd_z = (987654321 - i) & 0xffffffff;
}

// Returns number between 0 (inclusive) and 1.0 (exclusive),
// just like Math.random().
function myrandom()
{
    myrnd_z = (36969 * (myrnd_z & 65535) + (myrnd_z >> 16)) & 0xffffffff;
    myrnd_w = (18000 * (myrnd_w & 65535) + (myrnd_w >> 16)) & 0xffffffff;
    var result = ((myrnd_z << 16) + (myrnd_w & 65535)) >>> 0;
    result /= 4294967296;
    return result;
}

  function createTex(w,h,rnd=false) {
      var isFloat=true; if (!use_webgl2) isFloat=false;
      var halfFloat=false;
      var tex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      var ifmt = gl.RGBA;
      if(isFloat) ifmt = halfFloat ? gl.RGBA16F : gl.RGBA32F ;
      var data=null;
      if (rnd) {
          myseed(100);
          if (isFloat)
          {
             data = new Float32Array(w*h*4);
             for(var i=0;i<w*h*4;i++) data[i]=myrandom();
          }
          else
          {
             data = new Uint8Array(w*h*4);
             for(var i=0;i<w*h*4;i++) data[i]=Math.floor(myrandom()*255.99);
          }
      }
      gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,gl.RGBA,
                    isFloat?gl.FLOAT:gl.UNSIGNED_BYTE,data);
      return tex;
  }

  function createTexFromImg(img) {
      var tex = gl.createTexture();

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      var ifmt = gl.RGBA;
      gl.texImage2D(gl.TEXTURE_2D,0,ifmt,img.width,img.height,0,gl.RGBA,gl.UNSIGNED_BYTE,img);

  {

  function createFB(Buff, w,h, hasDepth=true) {
      Buff.fb = gl.createFramebuffer();
      Buff.texF = createTex(w,h);   if (!use_webgl2) setTexClampToEdge(Buff.texF); // wow - this is needed by webgl1!!?!
      Buff.texB = createTex(w,h);   if (!use_webgl2) setTexClampToEdge(Buff.texB); // wow - this is needed by webgl1!!?!
      gl.bindFramebuffer(gl.FRAMEBUFFER,Buff.fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER,
                              gl.COLOR_ATTACHMENT0,
                              gl.TEXTURE_2D,
                              Buff.texB,
                              0);
      if(hasDepth){
          var depth_id=gl.createRenderbuffer();
          gl.bindRenderbuffer(gl.RENDERBUFFER,depth_id);
          if (use_webgl2)
            gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
          else
            gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
          gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depth_id);
      }
      var e=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      if(gl.FRAMEBUFFER_COMPLETE !== e) {
         console.log("incomplete fb: "+e.toString());
      }
      return Buff;
  }

  function getShaderSrcPortion(src, name, processIncludes=true)
  {
      var sstr="###BEGIN:"+name+".glsl";
      var pos1=src.search(sstr);
      var pos2=src.substring(pos1+2).search("###BEGIN:");
      if (pos2==-1) pos2=src.substring(pos1+2).length;
      var rstr=src.substring(pos1+sstr.length+1,pos1+2+pos2);

      // replace includes
      if(processIncludes) {
          var sstr="\n#include ";
          while( (pos1=rstr.search(sstr))!=-1 ) {
              var str2=rstr.substring(pos1+10);
              var pos2=str2.search("\n");
              var incName=str2.substring(0,pos2);
              if(incName.substr(incName.length-5)==".glsl") incName=incName.substr(0,incName.length-5);
              rstr=rstr.slice(0,pos1)+getShaderSrcPortion(src,incName,false)+rstr.slice(pos1+10+pos2);
          }
      }

      return rstr;
  }

  function parseDirectives(src,directives) {
      rstr=src;
      rstr=rstr.replace(/^#(ShaderooNumPasses|NumTriangles|ShaderooNumTriangles|ShaderooCopyParameter) (.*)/gm,
                        function(m1,m2,m3){
                            directives[m2] = m3;
                            if(m2!="ShaderooCopyParameter")
                                directives[m2] = parseInt(m3);
                            return"//#"+m2+" "+m3+"\n";
                        }
                       );
      return rstr;
  }

//---------------------------------------------------------------------------------------------------
  function matchFuncParams(fname, str){
    var pos=[];
    var i0=-1;
    for(var i=0;i<str.length;i++) { 
      if(str.substring(i,i+fname.length)==fname) { i0=i; break; } 
    }
    if (i0==-1) return [];
    pos.push(i0); // 1st idx = function match
    i0+=fname.length;
    for(;i0<str.length;i0++) { var ch=str.charAt(i0); if(ch!=" " && ch!="\n" && ch !="\t") break; }
    if ( str.charAt(i0) != "(" ) return [];
    var lev=0;
    pos.push(i0); i0++;
    for(var i=i0+1;i<str.length;i++){
        var ch=str.charAt(i);
        if( ch=="," && lev==0 ) pos.push(i);
        if( ch=="(" ) lev++;
        if( ch==")" ) { lev--; if (lev<0) { pos.push(i); break; } } 
        
    }
    return pos;
  }
  

//---------------------------------------------------------------------------------------------------
  function init() {

      var w=canvas.width;
      var h=canvas.height;
      params={};
      var allSrc;
      if(allShadersStr!="")
          allSrc=allShadersStr;
      else
          allSrc=document.getElementById("allShaders").text;
          
      if(!use_webgl2)
      {
          var pos=[];
          //allSrc=allSrc.replaceAll(/texelFetch\(([^,]*),([^,]*),([^,)]*)\)/g,
          //function(x,ch,pos,lev) { return "texture("+ch+",(vec2("+pos+")+.5)/"+ch+"Res,-1e30)" });
          while ( (pos=matchFuncParams("texelFetch", allSrc)).length != 0 )  {
              ch=allSrc.slice(pos[1]+1,pos[2]).trim();
              allSrc=allSrc.slice(0,pos[0])+"texture"+allSrc.slice(pos[1],pos[2]+1)
                    +"(vec2("+allSrc.slice(pos[2]+1,pos[3])+")+.5)/"+ch+"Res,-1e30)"
                    +allSrc.slice(pos[4]+1);
          }
          //allSrc=allSrc.replaceAll(/textureSize\(([^,)]*),([^,)]*)\)/g,function(x,a,b,c) { return a+"Res" });
          while ( (pos=matchFuncParams("textureSize", allSrc)).length != 0 )  {
              ch=allSrc.slice(pos[1]+1,pos[2]).trim();
              allSrc=allSrc.slice(0,pos[0])+"ivec2("+ch+"Res+.5)"+allSrc.slice(pos[3]+1);
          }
      }

    
      var lines=allSrc.split("\n");
      for(var lidx in lines) {
          var line=lines[lidx];
          var elems=line.split(" ");
          var lhead=elems[0].substring(0,elems[0].length-1);
          if(!(lhead.startsWith("Buff") || lhead.startsWith("Geom") || lhead.startsWith("Image"))) continue;

          Buff={};
          Buff.width=-1;
          Buff.height=-1;
          Buff.texname=[];
          Buff.genMipmap=0;
          Buff.blending="none";
          Buff.depthTest=1;
          Buff.numPasses=1;
          Buff.numTriangles=2;
	  if(lhead.startsWith("Geom")) Buff.numTriangles=0x10000;
          for (var i=1;i<elems.length;i++) {
              if (elems[i].search(".glsl")>0) break;
              var tname=elems[i];
              Buff.texname[i-1]=tname;
              if(tname.endsWith(".jpg")) loadTex(tname);
              if(tname.endsWith(".png")) loadTex(tname);
          }
          var shsrc=getShaderSrcPortion(allSrc, lhead); // FIXME - get shader name from elems
          var directives={};
          shsrc=parseDirectives(shsrc,directives);
          if ("NumTriangles"        in directives) Buff.numTriangles = directives.NumTriangles;
          if ("NumPasses"           in directives) Buff.numPasses    = directives.NumPasses;
          if ("ShaderooNumPasses"   in directives) Buff.numPasses    = directives.ShaderooNumPasses;
          if(lhead.startsWith("Geom"))
              Buff.shader=loadGeomShader(shsrc);
          else
              Buff.shader=loadBufferShader(shsrc);

          // params+options
          for (var i=1;i<elems.length;i++) {
              if (elems[i].startsWith("opt:")) {
                  opts=elems[i].substring(4).split(";");
                  for(var o in opts) {
                      // params
                      if(opts[o].startsWith("uniform.")) { var pv=opts[o].substring(8).split("="); params[pv[0]]=pv[1]; }
                      // options
                      else { var pv=opts[o].split("="); Buff[pv[0]]=pv[1]; }
                  }
                  break;
              }
          }
          
          //### extern params
          
          if(!lhead.startsWith("Image"))
              createFB(Buff, getBuffSize(Buff).w, getBuffSize(Buff).h);
          else
              Buff.fb = null;

          buffers[lhead]=Buff;
          if(lhead!="Image") order.push(lhead);
      }
      order.push("Image");
  }

//---------------------------------------------------------------------------------------------------
  function draw() {

      console.log("mouse all: "+mouse.allX+" "+mouse.allY);
      updateKeyboardTex();

      var w=canvas.width;
      var h=canvas.height;

      if(startTime<0.) startTime=Date.now()/1000.0;
      var newTime = Date.now()/1000.0-startTime;
      var paused=false;
      if(paused) newTime = actTime;
      actTimeDelta = (actTime==0.0)?0.0:newTime-actTime;
      actTime=newTime;

      for (idx in order) {
          var Buff=buffers[order[idx]];
          for(var passIdx=0;passIdx<Buff.numPasses;passIdx++)
          {
              textures=[];
              texSizes=[];
              for (tidx in Buff.texname) {
                  var tex=Buff.texname[tidx];
                  if(tex.startsWith("Ref:")) { var sp=tex.substring(4).split(":"); tex=buffers[sp[0]].texname[parseInt(sp[1].substring(3))]; }
                  if      (tex in stdTex)   { textures[tidx]=stdTex[tex];       if(!use_webgl2) texSizes[tidx]=stdTexSize[tex]; }
                  else if (tex in videoTex) { textures[tidx]=videoTex[tex];     if(!use_webgl2) texSizes[tidx]={w:256,h:256}; }
                  else if (tex in utilTex)  { textures[tidx]=utilTex[tex];      if(!use_webgl2) texSizes[tidx]={w:256,h:256}; }
                  else if (tex in buffers)  { textures[tidx]=buffers[tex].texF; if(!use_webgl2) texSizes[tidx]=getBuffSize(buffers[tex]); }
                  else                      { textures[tidx]=rand256;           if(!use_webgl2) texSizes[tidx]={w:256,h:256}; }
              }
              var buffSize=getBuffSize(Buff);
              //console.log(buffSize);
              renderGeomBuffer(Buff.fb, buffSize.w, buffSize.h, Buff.shader, Buff.numTriangles, 
                               textures, texSizes, 
                               Buff.numPasses, passIdx,
                               Buff.blending, Buff.depthTest);
              if(Buff.fb!=null) Swap(Buff);
              if(Buff.genMipmap!=0) genMip(Buff.texF);
          }
      }
  }

//---------------------------------------------------------------------------------------------------
  function animate()
  {
     draw();
     frameCnt++;
     if (frameCnt==1) fxpreview();
     //###PostFrame###
     if(AnimEnable) requestAnimationFrame(animate);
  }

//---------------------------------------------------------------------------------------------------

setTimeout(() => {
init();
resize();
requestAnimationFrame(animate);
}, 100);


CanvWidthOverride=null;
CanvHeightOverride=null;
function save_as_png()
{
    CanvWidthOverride=4096;
    CanvHeightOverride=4096;
    CanvWidthOverride=canvas.width*3;
    CanvHeightOverride=canvas.height*3;
    resize();
    draw();
    var image = canvas.toDataURL();
    var aDownloadLink = document.createElement('a');
    aDownloadLink.download = 'mountain_moves.png';
    aDownloadLink.href = image;
    aDownloadLink.click();
    CanvWidthOverride=null;
    CanvHeightOverride=null;
    resize();
}
