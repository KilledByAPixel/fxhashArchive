<!DOCTYPE html>
<html>
	<head>
		<title>Very Large Array</title>
		<meta charset="utf-8" >
		<meta name="viewport" content="width=device-width, initial-scale=1" >
		<meta name="description" content="Very Large Array is a generative token by Leander Herzog. It creates one very large array to generate both visuals and audio. Made with javascript, webgl and the web audio api." >
		<meta name="twitter:creator" content="@lennyjpg" >
		<meta name="twitter:url" content="https://leanderherzog.ch/2022/vla" >
		<meta name="twitter:card" content="summary_large_image" >
		<meta name="twitter:site" content="@lennyjpg" >
		<meta name="twitter:title" content="Very Large Array" >
		<meta name="twitter:description" content="Very Large Array is a generative token by Leander Herzog. It creates one very large array to generate both visuals and audio. Made with javascript, webgl and the web audio api." >
		<meta name="twitter:image" content="https://leanderherzog.ch/2022/vla/preview.png" >
		<meta property="og:image" content="preview.png" >
		<style>
			body {
				margin: 0;
				overflow: hidden;
				background: black;
				height: 100vh;
				cursor: crosshair;
				-webkit-tap-highlight-color: transparent;
			}
			canvas {
				height: 100%;
				width: 100%;
				-webkit-tap-highlight-color: transparent;
			}

			#fs {
				width: 1em;
				height: 1em;
				display: inline-block;
				position: fixed;
				top: 0;
				right: 0;
				margin: 1em;
				border-top: 2px solid #aaa;
				border-right: 2px solid #aaa;
				cursor: pointer;
				transition: opacity 0.3s ease,
					transform 0.3s ease, border 0.3s ease;
				animation: showbtn 1s ease 1s both;
			}
			#fs.hide:not(:hover) {
				opacity: 0;
			}

			@keyframes showbtn {
				from {
					opacity: 0;
				}
			}

			#fs:hover {
				border-top: 2px solid #111;
				border-right: 2px solid #111;
				transform: scale(1.1);
			}

			:-webkit-full-screen #fs {
				display: none;
			}

			:fullscreen #fs {
				display: none;
			}
		</style>
		<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
	</head>
	<body>
		<div id="fs"></div>
		<script src="main.js" type="module"></script>
	</body>
</html>
