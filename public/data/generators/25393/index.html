<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Smooth Steps</title>
		<meta name="viewport"                              content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="mobile-web-app-capable"                content="yes">
		<meta name="apple-mobile-web-app-capable"          content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<meta name="apple-mobile-web-app-title"            content="Smooth Steps">
		<meta name="application-name"                      content="Smooth Steps">
		<meta name="msapplication-TileColor"               content="#000000">
		<meta name="theme-color"                           content="#000000">
		<meta name="msapplication-config"                  content="./icons/browserconfig.xml">
		<link rel="icon"             href="./icons/icon.svg"     type="image/svg+xml">
		<link rel="icon"             href="./icons/icon_48.png"  type="image/png">
		<link rel="shortcut icon"    href="./icons/icon_48.png"  type="image/png">
		<link rel="apple-touch-icon" href="./icons/icon_180.png" type="image/png">
		<link rel="manifest"         href="./icons/site.webmanifest">
		<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
		<style>
			html {
				height: 100%;
			}
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: black;
			}
			canvas {
				display: block;
				height: 100%;
				width: 100%;
			}
			pre {
				font-family: monospace;
				position: absolute;
				left: 0;
				top: 0;
				margin: 0;
				padding: 1em 2ch;
				color: gray;
				background-color: black;
			}
			.invisible {
				display: none;
			}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<pre class="invisible"></pre>
		<script type="module">
			import { app, features } from './js.js'

			window.$fxhashFeatures = features

			// Some settings can be configured through URL search paraemters:
			const params = new URLSearchParams(location.search)
			const settings = {
				width     : parseInt(params.get('width'))                  ||  0 , // 0 = window width
				height    : parseInt(params.get('height'))                 ||  0,  // 0 = window height
				density   : parseInt(params.get('density'))                ||  2,  // 0 = devicePixelRatio
				quality   : Math.max(1, parseInt(params.get('quality')))   ||  2,  // 1 is best
				targetFPS : parseInt(params.get('fps'))                    || 60,  // capped at 60
				duration  : Math.max(10, parseInt(params.get('duration'))) || 40,  // cicle length (measured in frames)
				steps     : Math.max(4, parseInt(params.get('steps')))     ||  8,  // cell look-around
			}

			app.boot(settings)

			window.addEventListener('keyup', e => {
				if        (e.key == 'i') {
					app.toggleInfo()
				} else if (e.key == 'm') {
					document.querySelector('.controls').classList.toggle('invisible')
				} else if (e.key == 'c') {
					document.style.cursor = document.style.cursor === 'none' ? 'auto' : 'none'
				} else if (e.key == 'f') {
					const FS_el = document.body
					if (FS_el.requestFullscreen) {
						FS_el.requestFullscreen().catch(e => consle.warn(e))
					} else if (FS_el.webkitRequestFullscreen) {
						FS_el.webkitRequestFullscreen()
					}
				} else if (e.key == 'p') {
					app.exportPNG()
				} else if (e.key == '0') {
					app.setDensity(0)
				} else if (e.key == '1') {
					app.setDensity(1)
				} else if (e.key == '2') {
					app.setDensity(2)
				} else if (e.key == '3') {
					app.setDensity(3)
				} else if (e.key == '4') {
					app.setDensity(4)
				} else if (e.key == 'q') {
					app.toggleQuality()
				}
			})
		</script>
	</body>
</html>
