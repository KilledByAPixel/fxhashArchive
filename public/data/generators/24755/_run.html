<style>body,html {margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#000;color:#fff;font:21px monospace;}canvas {display:block;width:100vmin;height:100vmin;bottom:0;left:0;margin:auto;overflow:auto;position:fixed;right:0;top:0;object-fit:contain;background:#fff;box-shadow:0 0 25px rgba(0,0,0,0.1);}.hidden {display:none;}</style>

<canvas id=canvas width=3000 height=3000></canvas>
<script>
let mainCtx = canvas.getContext("2d"), ticketCtx = ticketCanvas.getContext("2d");
let logo1, logo2, logo3;
const colors = ["#6A888C", "#8EA98D", "#B4D3B2"], backgroundColor = pick(colors);
const qr = "1111111000001000101111111100000101010011100100000110111010000100111010111011011101011111111001011101101110100101100010101110110000010110010010010000011111111010101010101111111000000000111101010000000011111011110101100101010100011100010110100110100010000001101010001111111101101110101000010010101000010000111111110110011110111100101010001010011010101010001111010010110111110111011010110101001110110001100011100111011011111010000000000111100011000110001111111011101010101010111100000100101001010001101110111010111111111111101101011101010011011101011111101110101010010100000110110000010100010011101110011111111011010110000111111";
const BOLD_FONT = "GillSansBold", LIGHT_FONT = "GillSansMedium";
const BG_COLOR1 = "#" + (pick("6789abcd".split("")) + pick("1234567890ABCDEF".split(""))).repeat(3);
const BG_COLOR2 = "#" + (pick("9a".split("")) + pick("1234567890ABCDEF".split(""))).repeat(3);

/*

Once upon a time, there was an unknown artist who was a part of the Blind Gallery Club. 

*/
window.addEventListener("DOMContentLoaded", async () => {
	document.fonts.add(await new FontFace(BOLD_FONT, `url('${BOLD_FONT}.otf') format("truetype")`).load());
	document.fonts.add(await new FontFace(LIGHT_FONT, `url('${LIGHT_FONT}.otf') format("truetype")`).load());

	fillRect(mainCtx, 0, 0, canvas.width, canvas.height, backgroundColor);

	logo1 = await loadSVG("1.svg");
	logo2 = await loadSVG("2.svg");
	logo3 = await loadSVG("3.svg");

	let angle = Math.round(range(-2.5, 2.5) * 2) * 0.1;
	let positions = pick([[0, 500, 1000, 1500, 2000, 2500, 3000]]);
	mainCtx.shadowColor = "rgba(0,0,0,0.05)";
	mainCtx.shadowBlur = 20;
	mainCtx.shadowOffsetX = 5;
	mainCtx.shadowOffsetY = 5;
	for (let x of shuffle([...positions])) {
		for (let y of shuffle([...positions])) {
			if (!(x === 1500 && y === 1500)) {
				drawTicket(x, y, 1, pick([angle, Math.PI * 0.5 + angle, Math.PI - angle, Math.PI * 1.5 - angle]), true);
			}
		}
	}

	mainCtx.globalCompositeOperation = "hue";
	mainCtx.globalAlpha = 1;
	let clrs = [...colors, "#e66972", "#57838c", "#78b293"];
	if (fxrand() > 0.75) clrs.push("#aaa");
	if (fxrand() > 0.05) clrs.push(pick(clrs));
	shuffle(clrs);
	let isFlat = fxrand() > 0.75;
	let flatColor = pick(clrs);
	while (flatColor == "#e66972") flatColor = pick(clrs);

	let gradient = mainCtx.createLinearGradient(0, 0, range(canvas.width / 2, canvas.width * 1.5), range(canvas.height / 2, canvas.height * 1.5));
	gradient.addColorStop(0, isFlat ? flatColor : clrs.pop());
	gradient.addColorStop(0.5, isFlat ? flatColor : clrs.pop());
	gradient.addColorStop(1, isFlat ? flatColor : clrs.pop());
	fillRect(mainCtx, 0, 0, canvas.width, canvas.height, gradient);

	mainCtx.globalAlpha = 0.25;
	mainCtx.globalCompositeOperation = "multiply";
	fillRect(mainCtx, 0, 0, canvas.width, canvas.height, backgroundColor);
	mainCtx.globalAlpha = 1;
	mainCtx.globalCompositeOperation = "color";
	fillRect(mainCtx, 0, 0, canvas.width, canvas.height, "#fff");

	mainCtx.globalAlpha = 1;
	mainCtx.globalCompositeOperation = "overlay";
	fillRect(mainCtx, 0, 0, canvas.width, canvas.height, gradient);

	mainCtx.globalAlpha = 1;
	mainCtx.globalCompositeOperation = "source-over";

	let mainTicketScale = 2.1;
	mainCtx.shadowColor = "rgba(0,0,0,0.2)";
	mainCtx.shadowBlur = 80;
	mainCtx.shadowOffsetX = 30;
	mainCtx.shadowOffsetY = 30;

	drawTicket(1500, 1500, mainTicketScale, angle, false);

	mainCtx.shadowColor = "rgba(0,0,0,0.2)";
	mainCtx.shadowBlur = 240;
	mainCtx.shadowOffsetX = 60;
	mainCtx.shadowOffsetY = 60;

	drawTicket(1500, 1500, mainTicketScale, angle, false);
});

/*

This artist was fascinated with the idea of creating art with code that was not only visually appealing, but also challenged the viewers' perception. 

*/

function drawTicket(x, y, scale = 1, angle = 0, invert) {
	let w = ticketCanvas.width,
		h = ticketCanvas.height;
	ticketCtx.fillStyle = invert ? BG_COLOR1 : "white";
	ticketCtx.fillRect(0, 0, w, h);

	let textColor = !invert ? "#333333" : "#f0f0f0";

	fillRect(ticketCtx, 0, 0, w, 430, invert ? BG_COLOR2 : "#FCFCFC");

	ticketCtx.strokeStyle = backgroundColor;
	ticketCtx.globalAlpha = 0.5;
	ticketCtx.lineWidth = 2.5;
	roundedRect(ticketCtx, 30, 430, w - 60, h - 500 - 30, 15);
	ticketCtx.stroke();
	ticketCtx.globalAlpha = 1;

	barCode(ticketCtx, 50, 100, w - 75, 100, textColor);
	drawQR(ticketCtx, qr, w - 160, h - 230, 4, 4, textColor);
	ticketCtx.drawImage(pick([logo1, logo2, logo3]), 0, 460, w, w);

	maskTicket(ticketCtx);

	ticketCtx.fillStyle = textColor;
	ticketCtx.font = `32px "${LIGHT_FONT}"`;
	ticketCtx.textAlign = "left";
	let number = "#BG" + Math.floor(range(0, 10)) + Math.floor(range(0, 10)) + Math.floor(range(0, 10)) + Math.floor(range(0, 10)) + Math.floor(range(0, 10));

	ticketCtx.fillText(number, 50, 240);

	ticketCtx.font = `32px "${BOLD_FONT}"`;
	ticketCtx.textAlign = "right";
	ticketCtx.fillText("SEED EDITION", w - 50, 240);
	ticketCtx.font = `32px "${LIGHT_FONT}"`;
	ticketCtx.fillText("MINT PASS", w - 50, 275);

	for (let x = 0; x < 52; x++) {
		if (fxrand() > 0.5) circle(ticketCtx, 55 + 10 * x, 295, 3, textColor);
		if (fxrand() > 0.6) circle(ticketCtx, 55 + 10 * x, 305, 3, textColor);
		if (fxrand() > 0.4) circle(ticketCtx, 55 + 10 * x, 315, 3, textColor);
	}

	ticketCtx.font = `21px "${LIGHT_FONT}"`;
	ticketCtx.textAlign = "center";
	ticketCtx.fillText("E X C H A N G E   A T   B L I N D G A L L E R Y . X Y Z", w / 2, h - 50);

	mainCtx.save();
	mainCtx.translate(x, y);
	mainCtx.rotate(angle);
	mainCtx.scale(scale, scale);
	mainCtx.drawImage(ticketCanvas, -w / 2, -h / 2, w, h);

	mainCtx.restore();
}

/*

The artist was a coder and used their skills to create a unique artwork for the Blind Gallery's next event called the "SEED EDITION".

*/

function circle(ctx, x, y, r, color) {
	ctx.fillStyle = color;
	ctx.beginPath();
	ctx.arc(x, y, r, 0, Math.PI * 2);
	ctx.fill();
}

/*

The artist coded the art of the "Blind Gallery" mint passes, which looked like disposable tickets with a backdrop of other tickets. 

*/

function barCode(ctx, x, y, width, height, color) {
	let w = ticketCanvas.width,
		h = ticketCanvas.height;
	let x1 = 0;
	let barWidth;
	let c = 0;
	while (x1 < x + width - 60) {
		let isLong = c == 0 || c == 19 || c == 20;
		barWidth = isLong ? 5 : range(2, 10);
		fillRect(ctx, x + x1, y, barWidth, height, color);
		x1 += barWidth + pick([10, 10, 10, 5]);

		c++;
	}
	fillRect(ctx, x + width - 55, y, 5, height, color);
}

/*

The tickets had mysterious dots and barcodes that were visually intriguing, but didn't hold any real meaning. 

*/

function drawQR(ctx, qr, x, y, w, h, color) {
	let chars = qr.split("").map((v) => v === "1");
	let s = 25;
	for (let x1 = 0; x1 < s; x1++)
		for (let y1 = 0; y1 < s; y1++) {
			if (chars[y1 * s + x1]) {
				fillRect(ctx, x + x1 * w, y + y1 * h, w, h, color);
			}
		}
}

/*

The artist wanted to challenge the viewers to look beyond the surface and find the deeper meaning in the seemingly random patterns. Was it or wasn't it there?

*/

function fillRect(ctx, x, y, w, h, color) {
	ctx.fillStyle = Array.isArray(color) ? pick(color) : color;
	ctx.fillRect(x, y, w, h);
}

/*

As the event approached, members of the Blind Gallery Club received their mint passes. 

*/

function roundedRect(ctx, x, y, w, h, r) {
	if (w < 2 * r) r = w / 2;
	if (h < 2 * r) r = h / 2;
	ctx.beginPath();
	ctx.moveTo(x + r, y);
	ctx.arcTo(x + w, y, x + w, y + h, r);
	ctx.arcTo(x + w, y + h, x, y + h, r);
	ctx.arcTo(x, y + h, x, y, r);
	ctx.arcTo(x, y, x + w, y, r);
	ctx.closePath();
}

/*

They were fascinated by the unusual yet familiar design of the tickets and couldn't wait to attend the event to see what the other artists had created.

*/

function maskTicket(ctx) {
	ctx.save();
	let maskCanvas = document.createElement("canvas");
	let maskCtx = maskCanvas.getContext("2d");
	maskCanvas.width = ticket.width;
	maskCanvas.height = ticket.height;
	maskCtx.drawImage(ticket, 0, 0);

	ctx.globalCompositeOperation = "destination-in";
	ctx.drawImage(maskCanvas, 0, 0);
	ctx.globalCompositeOperation = "source-over";
	ctx.restore();
}

/*

During the event, the mysterious artist was finally revealed and the audience was amazed to see it was them, again?

*/

function pick(arr) {
	return arr[(fxrand() * arr.length) | 0];
}

/*

The coded design of the mint passes was just a an entry to the final generative art that was about to come in this edition.

*/

function range(a, b) {
	return a + (b - a) * fxrand();
}

/*

The audience was transported to a world of the artists creations and was left in awe of the art's ability to evoke emotions and challenge their perceptions.

*/

function lerp(a, b, t) {
	return a + (b - a) * t;
}

/*

The "Blind Gallery" mint passes became a highly sought after collector's item, and the unknown artists were suddenly thrust into the spotlight. 

*/

function shuffle(array) {
	for (let i = array.length - 1; i > 0; i--) {
		const j = Math.floor(fxrand() * (i + 1));
		[array[i], array[j]] = [array[j], array[i]];
	}
	return array;
}

/*

The artist's work was now being displayed in museums and galleries all over the world, and the Blind Gallery event became one of the most talked about art events in recent history. 

*/

async function loadSVG(src) {
	return await loadImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(await fetch(src).then((v) => v.text())));
}

/*

The artist's unique perspective and creative use of technology had forever changed the way people thought about art and the possibilities of what it could be.

*/

function loadImage(src) {
	return new Promise((resolve, reject) => {
		let img = new Image();
		img.onload = () => resolve(img);
		img.onerror = reject;
		img.src = src;
	});
}
