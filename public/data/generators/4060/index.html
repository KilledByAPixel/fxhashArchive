<!doctype html><html><head><title>reborn</title><meta name="description" content="This is an album of cities too ideal to ever materialise.

    It consists of 256 algorithmically generated plans that resemble drawings of Vincenzo Scamozzi, Pietro Cataneo, Filarete and other theorists of the Italian Renaissance. The cities differ in size, the grid of the streets, the landscape around them and the people that inhabit their utopian walls. They carry names that are Italian exonyms of real European cities, drawing a vision of a different world that enacts a mixture of military perfection with social superiority. Flawless, harmonious, unconquerable and utterly impossible.
    
    History brought us many theories about ideal cities, but very few examples exist today. Italian Palmanova, Slovakian Nové Zámky or Polish Zamość are the few to remind us how hard it is to shape the reality according to ideals. When confronted with the material world, its idealism becomes the city's grates foe.
    
    To zoom, press a mouse button when over the image or touch the screen. To pan, keep the mouse pressed and move it around.

      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
