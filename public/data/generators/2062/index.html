          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0

          c = c + t | 0

      var fxrand = sfc32(...hashes)

      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
