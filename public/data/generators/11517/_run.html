    In 1993, Basque sculptor Eduardo Chillida proposed a project to create an immense
    void inside Tindaya, the Sacred Mountain of Fuerteventura's indigenous inhabitants.
    The hollow cube measuring approximately 45 x 50 x 65 meters was conceived as
    a space for 'all the people' to 'fully experience the tininess of humankind'.

    The idea of the project dates back to the 1980s, and it took the artist years of
    searching for the ideal mountain in different parts of the world. However, what was
    ideal for Chillida evoked a lot of controversy due to the environmental and social
    impact of the project. There was uncertainty about Tindaya's structural feasibility
    and the potential harm to the ancient petroglyphs engraved on its surface. What's
    more, the financial sustainability of the project's economic model would depend on
    hundreds of thousands of tourists visiting the site each year, converting a work
    of art into a holiday attraction.

    Chillida called his project the Monument to Tolerance. Although it never came into
    existence, it has caused division and conflict since it was conceived. 


    'hollow' is an exploration of 256 voids in nonexistent natural monuments. Made of
    digital matter instead of stone and lacking cultural charge, its sole purpose is to
    contemplate the tininess of humankind.
