		ctx.fillRect(0,0,canvas.width, canvas.height);
	} else if (backgroundType == "green") {
		ctx.fillStyle = GREEN;
		ctx.fillRect(0,0,canvas.width, canvas.height);
	} else if (backgroundType == "blue") {
		ctx.fillStyle = BLUE;
		ctx.fillRect(0,0,canvas.width, canvas.height);
	} else if (backgroundType == "gradient") {
		// normal card gradient
		gradient = ctx.createLinearGradient(t*canvas.width, 0, (1-t)*canvas.width, canvas.height);
		gradient.addColorStop(0, colors[0]);
		gradient.addColorStop(range(0.3,0.5), colors[1]);
		gradient.addColorStop(range(0.5,0.6), colors[1]);
		gradient.addColorStop(1, colors[2]);
		
		ctx.fillStyle = gradient;
		let x = range(-200,0);
		ctx.fillRect(x,0,canvas.width - x + range(0,200),canvas.height);
		
	} else if (backgroundType == "transparent") {
		ctx.clearRect(0,0,canvas.width, canvas.height);
	}
	
	// inner card border
	if (borderType != "borderless") {
		ctx.save();
		let innerCardMargin = borderRadius;
		
		ctx.lineWidth = 2;
		ctx.globalAlpha = 1;
		ctx.strokeStyle = isPremium ? GOLD : WHITE;
		roundedRect(ctx, innerCardMargin, innerCardMargin, canvas.width-innerCardMargin*2, canvas.height-innerCardMargin*2, borderRadius * (30/40));
		ctx.stroke();
		ctx.restore();	
		
		if (fxrand() > 0.5) {
			innerCardMargin -= 10;
			ctx.lineWidth = 2;
			ctx.globalAlpha = 0.75;
			ctx.strokeStyle = isPremium ? GOLD : WHITE;
			roundedRect(ctx, innerCardMargin, innerCardMargin, canvas.width-innerCardMargin*2, canvas.height-innerCardMargin*2, borderRadius);
			ctx.stroke();
			ctx.restore();
		}
	}
	
	// outer card border
	let strokeGradient = ctx.createLinearGradient(t*canvas.width, 0, (1-t)*canvas.width, canvas.height);
	if (borderType == "gold") {
		strokeGradient.addColorStop(0, "#aa7a2f");
		strokeGradient.addColorStop(0.25, "#ebd377");
		strokeGradient.addColorStop(0.5, "#f8eebf");
		strokeGradient.addColorStop(1, "#b3873a");
		
		ctx.lineWidth = 10;
		ctx.strokeStyle = strokeGradient;
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
		ctx.stroke();
		
		ctx.lineWidth = 5;
		ctx.strokeStyle = "#FFF";
		roundedRect(ctx, 7.5, 7.5, canvas.width-15, canvas.height-15, borderRadius*0.75);
		ctx.stroke();
	} else if (borderType == "silver") {
		ctx.lineWidth = 5;
		ctx.strokeStyle = "#fff";
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
		ctx.stroke();
	} else if (borderType == "blue gradient") {
		let strokeColors = ["#113d4b",BLUE,"#FFF",LIGHT_BLUE];
		shuffle(strokeColors);
		strokeGradient.addColorStop(0, strokeColors[0]);
		strokeGradient.addColorStop(0.3, strokeColors[1]);
		strokeGradient.addColorStop(0.6, strokeColors[2]);
		strokeGradient.addColorStop(1, strokeColors[3]);
		
		ctx.lineWidth = 20;
		ctx.strokeStyle = strokeGradient;
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
		ctx.stroke();
	} else if (borderType == "green gradient") {
		let strokeColors = ["#265b32",GREEN,"#FFF",LIGHT_GREEN];
		shuffle(strokeColors);
		strokeGradient.addColorStop(0, strokeColors[0]);
		strokeGradient.addColorStop(0.3, strokeColors[1]);
		strokeGradient.addColorStop(0.6, strokeColors[2]);
		strokeGradient.addColorStop(1, strokeColors[3]);
		
		ctx.lineWidth = 20;
		ctx.strokeStyle = strokeGradient;
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
		ctx.stroke();
	} else if (borderType == "red gradient") {
		let strokeColors = ["#521519",RED,"#FFF",LIGHT_RED];
		shuffle(strokeColors);
		strokeGradient.addColorStop(0, strokeColors[0]);
		strokeGradient.addColorStop(0.3, strokeColors[1]);
		strokeGradient.addColorStop(0.6, strokeColors[2]);
		strokeGradient.addColorStop(1, strokeColors[3]);
		
		ctx.lineWidth = 20;
		ctx.strokeStyle = strokeGradient;
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
		ctx.stroke();
	} else if (borderType == "solid") { 
		ctx.lineWidth = 20;
		if (backgroundType == "red") ctx.strokeStyle = LIGHT_RED;
		else if (backgroundType == "blue") ctx.strokeStyle = LIGHT_BLUE;
		else if (backgroundType == "green") ctx.strokeStyle = LIGHT_GREEN;
		else ctx.strokeStyle = "#fff";
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius);
		ctx.stroke();
		
		ctx.lineWidth = 2;
		ctx.globalAlpha = 0.5;
		if (backgroundType == "red") ctx.strokeStyle = "#000";
		if (backgroundType == "blue") ctx.strokeStyle = "#000";
		if (backgroundType == "green") ctx.strokeStyle = "#000";
		else ctx.strokeStyle = "#000";
		roundedRect(ctx, 5, 5, canvas.width-10, canvas.height-10, borderRadius*0.8);
		ctx.stroke();
		ctx.globalAlpha = 1;
	} else if (borderType == "gradient") {
		let strokeColors = [LIGHT_GREEN, LIGHT_BLUE, LIGHT_RED, RED, GREEN, BLUE, "#fff", "#fff"];
		shuffle(strokeColors);
		strokeColors.forEach((color, idx, a) => strokeGradient.addColorStop(idx/(a.length-1), color));
		
		ctx.lineWidth = 20;
		ctx.strokeStyle = strokeGradient;
		roundedRect(ctx, 0, 0, canvas.width, canvas.height, borderRadius*0.8);
		ctx.stroke();
	}
}

function pick(arr) {
	return arr[fxrand()*arr.length|0];
}

function range(a, b) {
	return a+(b-a)*fxrand();
}

function lerp(a, b, t) {
	return a+(b-a)*t;
}

async function loadSVG(src, color = "#ffbe88") {
	let svgString = await fetch(src).then(v => v.text());
	svgString = svgString.replaceAll(`fill="#000000"`, `fill="${color}"`);
	svgString = svgString.replaceAll(`stroke="#000000"`, `stroke="${color}"`);
	svgString = svgString.replaceAll(`fill:#000000`, `fill:${color}`);
	return await loadImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString));
}

function loadImage(src) {
	return new Promise((resolve, reject) => {
		let img = new Image()
		img.onload = () => resolve(img)
		img.onerror = reject;
		img.src = src;
	});
}

function timeout(delay) {
    return new Promise(resolve => setTimeout(resolve, delay));
}

function getHatched(color1, color2, opacity = 0.5, canvasSize = 13, strokeWidth = 2) {
	let canvas = document.createElement('canvas');
	canvas.width = canvas.height = toPx(canvasSize);
	let ctx = canvas.getContext('2d');
	ctx.lineJoin = 'miter';
	ctx.lineCap = 'square';
	ctx.lineWidth = toPx(strokeWidth);
	ctx.fillStyle = color1;
	ctx.fillRect(0,0,canvas.width,canvas.height);
	ctx.globalAlpha = opacity;
	ctx.strokeStyle = color2;
	ctx.beginPath();
	ctx.moveTo(0,0);
	ctx.lineTo(canvas.width,canvas.height);
	ctx.moveTo(canvas.width, 0);
	ctx.lineTo(canvas.width * 2,canvas.height);
	ctx.moveTo(0,canvas.height);
	ctx.lineTo(canvas.width,canvas.height * 2);
	ctx.stroke();
	
	ctx.save();
	ctx.globalAlpha = 1;
	ctx.translate(canvas.width*0.5,canvas.height*0.5);
	ctx.drawImage(canvas, -canvas.width*0.5, -canvas.height*0.5);
	ctx.restore();
	return ctx.createPattern(ctx.canvas, 'repeat');
}

function toPx(unit) { return Array.isArray(unit) ? unit.map(v => toPx(v)) : unit / 1024 * canvas.width }

String.prototype.replaceAt = function(index, replacement) {
    return this.substring(0, index) + replacement + this.substring(index + replacement.length);
}

class Braille {
	constructor() {
		this.dots = {
			"a": "100000",
			"b": "101000",
			"c": "110000",
			"d": "110100",
			"e": "100100",
			"f": "111000",
			"g": "111100",
			"h": "101100",
			"i": "011000",
			"j": "011100",
			"k": "100010",
			"l": "101010",
			"m": "110010",
			"n": "110110",
			"o": "100110",
			"p": "111010",
			"q": "111110",
			"r": "101110",
			"s": "011010",
			"t": "011110",
			"u": "100011",
			"v": "101011",
			"w": "011101",
			"x": "110011",
			"y": "110111",
			"z": "100111",
			" ": "000000",
			"#": "010111",
			".": "000000",
			"!": "111111",
		}
		let alphabethChars = Object.keys(this.dots);
		let brailleChars = ["⠁","⠃","⠉","⠙","⠑","⠋","⠛","⠓","⠊","⠚","⠅","⠇","⠍","⠝","⠕","⠏","⠟","⠗","⠎","⠞","⠥","⠧","⠺","⠭","⠽","⠵"," ","#",".","!"];
		this.brailleASCII = {}
		for(let i=0;i<alphabethChars.length;i++) this.brailleASCII[alphabethChars[i]] = brailleChars[i];
	}
	
	getWidth(word) {
		let offset = 0;
		for(let ii=0;ii<word.length;ii++) {
			let c = word.charAt(ii,1).toLowerCase();
			if (c !== " ") {
				offset += 3;
			} else if (c==" ") {
				offset += 1.25;
			}
		}
		return offset - 1;
	}
	
	print(word, pos = [20,20], scale=10, drawDotFn = this.drawDot, drawNonDotFn = null, drawLineFn = this.drawLine) {
		let ret = "";
		let offset = 0;
		for(let ii=0;ii<word.length;ii++) {
			let c = word.charAt(ii,1).toLowerCase();
			let bits = this.dots[c];
			if (c !== " " && drawLineFn) drawLineFn(offset, pos, scale, isPremium ? GOLD : WHITE);
			for(let jj=0;jj<bits.length;jj++) {
				let bit = bits.charAt(jj,1);
				if (bit === "1" && drawDotFn) drawDotFn(offset + (jj%2), (jj/2|0), pos, scale, isPremium ? GOLD : WHITE);
				else if (c != " " && bit === "0" && drawNonDotFn) drawNonDotFn(offset + (jj%2), (jj/2|0), pos, scale, isPremium ? GOLD : WHITE);
			}
			offset += c === " " ? 1.25 : 3;
			ret += this.brailleASCII[c];
		}
		return offset;
	}

	drawDot(x, y, pos, scale = 20, color = WHITE) {
		let r = 8;
		ctx.fillStyle = color;
		ctx.beginPath();
		ctx.arc(pos[0] + x*scale+r/2, pos[1] + y*scale+r/2, r*scale/20, 0, Math.PI*2);
		ctx.fill();
	}
	
	outlineDot(x, y, pos, scale = 20, color = WHITE) {
		let r = 8;
		ctx.fillStyle = color;
		ctx.beginPath();
		ctx.arc(pos[0] + x*scale+r/2, pos[1] + y*scale+r/2, r*scale/20, 0, Math.PI*2);
		ctx.stroke();
	}
	
	drawLine(x, pos, scale = 20, color = WHITE) {
		ctx.fillStyle = color;
		let space = 15*scale/20;
		ctx.fillRect(pos[0]+x*scale-space, pos[1]-space,1.5*scale/20,scale*3.5+space);
	}
}

function replaceForBraille(v) {
	v = v.toLowerCase() // convert everything to lowercase, replace non supported chars
		.replaceAll('-',' ')
		.replaceAll('_',' ')
		.replaceAll('(',' ')
		.replaceAll(')',' ')
		.replaceAll('ë','e')
		.replaceAll('á','a')
		.replaceAll('.',' ')
		.replaceAll(',',' ');

	let ret = '';
	let numbers = "0123456789".split('');
	let numbersReplacement = "abcdefghij".split('');
	let isNumber = false;
	for(let i=0;i<v.length;i++) {
		let char = v.charAt(i);
		if(!isNumber && numbers.includes(char)) {
			isNumber = true;
			ret += '#';
			char = numbersReplacement[numbers.indexOf(char)];
		} else if (numbers.includes(char)) {
			char = numbersReplacement[numbers.indexOf(char)];
		} else if(isNumber && !numbers.includes(char)) {
			isNumber = false;
		} 
		ret += char;
	}
	// replace doubles
	ret = ret
		.replaceAll('##', '#')
		.replaceAll('  ', ' ');
		
	return ret;
}

function Circles() {
    return new (class Circles {
        constructor() {
            this.pts = [];
        }
        insert(p1) {
            let p2,dx,dy,r;
            for (let i=0,leni=this.pts.length;i<leni;i++) {
                p2 = this.pts[i];
                dx = p1[0]-p2[0];
                dy = p1[1]-p2[1];
                r = p1[2]+p2[2];
                if (dx*dx+dy*dy < r*r) {
                    return false;
                }
            }
            this.pts.push(p1);
            return true;
        }
        get length() {
            return this.pts.length;
        }
    })();
}

function shuffle(array) {
	for (let i = array.length - 1; i > 0; i--) {
		const j = Math.floor(fxrand() * (i + 1));
		[array[i], array[j]] = [array[j], array[i]];
	}
}

// decoder, go figure
function e(val, ret='', nos=val.split('.').map(v=>parseInt(v)-1)) {
	for (let no of nos) ret += String.fromCharCode(no);
	return ret;
}
