<!DOCTYPE html>
<html>
<head>
  <title>Rain Ritual</title>
  <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
  <style>
  html,
  body {
    margin: 0px;
    padding: 0px;
    background-color: #333;
    text-align: center;
  }

  #link {
    display: none;
  }

  #progress {
    color: #06004c;
    font-size: 1.2vw;
    font-family: "Lucida Console", "Courier New", monospace;
    font-weight: bold;
    position: fixed;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
  }
  </style>
  <script src="./LICENSES.js"></script>
  <script src="./p5.min.js"></script>
  <script src="./jsts.min.js"></script>
  <script src="./bundle.min.js"></script>
</head>
<body>
<div id="progress">[1/3] Warming up....</div>
<script>
let gFactory = new jsts.geom.GeometryFactory();
let gShapeFactory = new jsts.util.GeometricShapeFactory();
let gC = jsts.geom.Coordinate;
let gpd = 2;
let gW = window.innerHeight;
let gH = window.innerHeight;
let gDrawing = false;
let gTimerID = null;
let gPrevHeight = window.innerHeight;
let gGrassRatio = 0;
let gWindAdjust = 0;
let gFrameDisabled = false;

const TYPE_GRASS = 0;
const TYPE_GROUND = 1;
const TYPE_MOUNTAINS = 2;
const TYPE_PAMPAS = 3;
const TYPE_ROCK = 4;
const TYPE_SKY = 5;
const TYPE_TUFT = 6;
const TYPE_TREE = 7;
const TYPE_FOLIAGE = 8;
const TYPE_FRAME = 9;
const TYPE_RAIN = 10;
const TEX_PERLIN = 0;
const TEX_SIN_VERT = 1;
const TEX_SIN_EASE = 2;
const GOD_INDIFFERENT = 0;
const GOD_WRATHFUL = 1;
const GOD_APPEASED = 2;
const TREE_FAITHFUL = 0;
const TREE_ARDENT = 1;
const TREE_MEEK = 2;
const TREE_STOIC = 3;
const TREE_BARK_LIGHT = 0;
const TREE_BARK_MEDIUM = 1;
const TREE_BARK_DARK = 2;
const VIEW_EYELINE = 0;
const VIEW_BELOW = 1;
const FRAME_NONE = 0;
const FRAME_FAINT_LIGHT = 1;
const FRAME_STRONG_LIGHT = 2;
const FRAME_FAINT_DARK = 3;
const FRAME_STRONG_DARK = 4;
const FRAME_OVERLAY_SKY = 0;
const FRAME_OVERLAY_FG_MG = 1;
const FRAME_OVERLAY_FG = 2;

window.addEventListener("resize", function() {
    clearTimeout(gTimerID);
    gTimerID = setTimeout(async function() {
        if (!gDrawing) {
            //Right click save causes Chrome to put a download bar at the bottom of the window, triggering a resize event
            if (Math.abs(gPrevHeight - window.innerHeight) > 66) {
                if (document.getElementsByTagName("main").length)
                    document.getElementsByTagName("main")[0].remove();
                gW = gH = window.innerHeight;
                setup();
                await draw();
            }
            gPrevHeight = window.innerHeight;
        }
    }, 1000);
});

window.addEventListener("keyup", async function(e) {
    let commands = { 49: [2048, 2048], 50: [3072, 3072], 51: [4096, 4096], 52: [5120, 5120], 53: [2560, 1440], 54: [3840, 2160], 55: [5128, 2880], 56: [7680, 4320],
                     81: [2048, 2048], 87: [3072, 3072], 69: [4096, 4096], 82: [5120, 5120], 84: [2560, 1440], 89: [3840, 2160], 85: [5128, 2880], 73: [7680, 4320] };
    for (let [k, v] of Object.entries(commands)) {
        if (e.keyCode == k) {
            if (!gDrawing) {
                if (document.getElementsByTagName("main").length)
                    document.getElementsByTagName("main")[0].remove();
                gW = v[0] / gpd;
                gH = v[1] / gpd;
                setup();
                gFrameDisabled = (e.keyCode > 56);
                await draw();

                let canvas = document.getElementsByTagName("canvas")[0];
                let link = document.getElementById('link');
                link.setAttribute('download', v[0] + 'x' + v[1] + '-' + fxhash + '.png');
                link.setAttribute('href', canvas.toDataURL("image/png").replace("image/png", "image/octet-stream"));
                link.click();
                e.preventDefault();
            }
            break;
        }
    }
}, false);

function setup() {
    document.body.style.cursor  = 'wait';
    document.getElementById("progress").style.display = 'block';
    console.log("https://www.fxhash.xyz/u/TenebrisVia\r\nhttps://linktr.ee/tenebris.via\r\nCopyright (c) 2022 Chris Woodworth - TenebrisVia\r\n\r\n")
    console.log('hash: ' + fxhash);
    gDrawing = true;
    resetSeed();
    createCanvas(gW, gH);
    pixelDensity(gpd);
    colorMode(HSB, 360, 100, 100, 100);
    noLoop();
    noStroke();
    noFill();
    angleMode(RADIANS);
}

function resetSeed() {
    fxrand = sfc32(...hashes);
    let seed = Math.floor(fxrand() * 1e8);
    randomSeed(seed);
    noiseSeed(seed);
}

async function draw() {
    let main = new Main(gW, gH);
    await main.create();
    await main.draw();
    await progressClear();
    gDrawing = false;
}

async function progress(message) {
    document.getElementById("progress").innerHTML = message;
    await new Promise((fn => setTimeout(fn, 1)));
}

async function progressClear() {
    document.getElementById("progress").style.display = 'none';
    document.body.style.cursor  = 'default';
    fxpreview();
    await new Promise((fn => setTimeout(fn, 1)));
}
</script>
<a id="link"></a>
</body>
</html>
