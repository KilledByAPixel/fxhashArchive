rn v*cos(angle) + vec2(-v.y,v)*sin(angle); }\nvec3 rotateXYZ(vec3 v, vec3 angles)\n{\n\tv.yz = rotate(v.yz, angles.x);\n\tv.xz = rotate(v.xz, angles.y);\n\tv.xy = rotate(v.xy, angles.z);\n\treturn v;\n}\n\nmat3 getRotationMatrix(vec3 rotation)\n{\n    return mat3(\n        rotateXYZ(vec3(1,0,0), rotation),\n        rotateXYZ(vec3(0,1,0), rotation),\n        rotateXYZ(vec3(0,0,1), rotation)\n    );\n}\n\n// main rendering function\nvoid mainImage(out vec4 fragColor, vec2 fragCoord)\n{\n    float borderSize = borderInfo.x;\n    float borderNoise = borderInfo.y;\n    float borderNoiseScale = borderInfo.z;\n    float borderSeed = borderInfo.w;\n\n    // get uv\n    vec2 uv = fragCoord;\n\n    // fit to border\n    uv = iResolution.xy * (uv - borderSize) / (iResolution.xy-2.*borderSize);\n    uv = (2. * uv - (iResolution.xy)) / (iResolution.y);\n\n    // cast ray\n    mat3 cameraTransform = getRotationMatrix(cameraRotation);\n    vec3 direction = cameraTransform * normalize(vec3(uv, cameraZoom));\n    vec3 color = getColor(cameraPosition, direction);\n\n    // gamma\n    const float gamma = 0.4545;\n    color = pow(clamp(color, 0., 1.), vec3(gamma));\n\n    // post effects\n    int postEffectID = int(sceneEffects.w);\n       \n    // grayscale\n    float grayscale = vaseInfo2.w;\n    float paletteColors = 8.;\n    if (grayscale > .5)\n    {\n        color = vec3((color.x+color.y+color.z)/3.);\n        paletteColors = 16.;\n    }\n\n    // grain\n    float filmGrain = (postEffectID==3||postEffectID==4) ? .3 : .1;\n    vec3 grainNoise = filmGrain*(.5-fractalNoise3(vec3(fragCoord,randomSeed+iTime*9.),3));\n    if (postEffectID!=4)\n        grainNoise = grainNoise.xxx;\n    color += grainNoise;\n\n    // effects\n    switch(postEffectID)\n    {\n        case 1: // invert\n            color = 1. - color;\n            break;\n\n        case 2: // palletize\n            color = floor(color*paletteColors+.5)/paletteColors;\n            break;\n    }\n\n    // border\n    vec2 borderPos = fragCoord;\n    vec3 n = fractalNoise3(vec3(fragCoord*borderNoiseScale/iResolution.y*1e3,borderSeed),4);\n    borderPos += borderNoise*borderSize*(n.xy-.5);\n    float borderBright = max(\n        ((abs(borderPos.x - iResolution.x/2.)-iResolution.x/2.)-borderSize)/borderSize/2.,\n        ((abs(borderPos.y - iResolution.y/2.)-iResolution.y/2.)-borderSize)/borderSize/2.);\n    borderBright = pow(borderBright, 6.);\n    vec3 borderColor2 = borderColor.xyz * vec3(1.-borderBright);\n    if (abs(borderPos.x - iResolution.x/2.) > iResolution.x/2.-borderSize\n            ||abs(borderPos.y - iResolution.y/2.) > iResolution.y/2.-borderSize)\n        color = borderColor2 + grainNoise;\n\n    fragColor = vec4(color, 1.);\n    //fragColor = texture(iChannel0, uv);return; // test data\n}\n\n// hash33 is based on Hash without Sine - MIT License - Copyright (c)2014 David Hoskins.\nvec3 hash33(vec3 p){return fract((p=dot(p=fract(vec3(.0993,.1011,.1037)*p),33.333+p.yxz)+p).zyx*(p.yxx+p.xxy));}\n\n// fast build noise, prevent inlining calls to hash33\nvec3 noise3(vec3 p)\n{\n    const vec2 o = vec2(1, 0);\n    vec3 i = floor(p);\n    vec3 f = smoothstep(0., 1., fract(p));\n\n    vec3 hashResult[8]; \n    for(int j=0; j<8; ++j)\n    {\n        vec3 z = vec3(\n            (j&1)==0?0.:1.,\n            (j&2)==0?0.:1.,\n            (j&4)==0?0.:1.);\n        hashResult[j] = hash33(i+z);\n    }\n    \n    return mix(\n        mix\n        (\n            mix(hashResult[0], hashResult[1], f.x), \n            mix(hashResult[2], hashResult[3], f.x), \n            f.y\n        ),\n        mix\n        (\n            mix(hashResult[4], hashResult[5], f.x), \n            mix(hashResult[6], hashResult[7], f.x),\n            f.y\n        ),\n        f.z\n    );\n}\n\nvec3 fractalNoise3(vec3 p, int octaves)\n{\n    const float H = 1., G = exp2(-H);\n    float f = 1., a = 1., ta = a;\n    vec3 t = vec3(0);\n    for (int i = octaves; --i >= 0;)\n    {\n        t += a*noise3(f*p);\n        ta + e ambient occusion\n    const float strength = 0.100;\n    const float scale = 0.100;\n    const int stepCount = 5;\n\tfloat occlusion = 0.;\n    for (int i = 0; ++i < stepCount;)\n    {\n        float d = scale * float(i);\n        float distance = sceneDistance(position + d * normal).x;\n        occlusion += max((d - distance) / d, 0.); \n    }\n    return max(1. - occlusion * strength, 0.);\n}\n\nvec3 getDirectionalLight(vec3 lightDirection, vec3 lightColor, float lightSoftness, bool castShadow, float lightRange, vec3 position, vec3 direction, vec3 normal, vec3 diffuseColor, vec3 specularColor, float specularPower)\n{\n    // check if full shadow\n    float diffuseDot = dot(lightDirection, normal);\n    if (diffuseDot < 0.)\n        return vec3(0);\n\n    // apply shadow and shading\n    float shadowAmount = castShadow ? getShadow(position, lightDirection, lightSoftness, 1e4) : 1.;\n    vec3 diffuse = (diffuseDot * shadowAmount) * lightColor * diffuseColor;\n    if (specularPower == 0.)\n        return diffuse;\n\n    // apply specular\n    vec3 reflectDirection = reflect(direction, normal);\n    float specularDot = pow(max(dot(lightDirection, reflectDirection), 0.), 1. + specularPower);\n    vec3 specular = (specularDot * shadowAmount) * lightColor * specularColor;\n    return diffuse + specular;\n}\n\n///////////////////////////////////////////////////////////////////////////////\n// distance shapes\nfloat distancePlane(vec3 p, vec3 n) { return dot(p, n); }\nfloat opOnion(float sdf, float thick) { return abs(sdf)-thick; }\nvec2 opRevolution(vec3 p, float w) { return vec2( length(p.xz) - w, p.y ); }\nfloat distanceBox(vec3 p, vec3 s, float e)\n{\n    vec3 d = abs(p) - s + e;\n    return min(max(d.x, max(d.y, d.z)), 0.) + length(max(d, 0.)) - e;\n}\nfloat distanceCylinder(vec3 p, vec2 s, float e)\n{\n    vec2 d = abs(vec2(length(p.xz), p.y)) - s + e;\n    return min(max(d.x, d.y), 0.) + length(max(d, 0.)) - e;\n}\n\n// combine operators\nvec2 combineUnion(vec2 d1
