<!DOCTYPE html>
<html lang="en">

<head>
    <title>fx2-2</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta itemprop="name" content="fx2-2">
    
    
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden; /* disable scrolling / rubberband effect on mobile */
        }

        canvas {
            display: block;
            position: absolute;
            outline:0;
        }

        * {
            /* disable on touch highlights of html elements, especially on mobile! */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            box-sizing: border-box;
            width: 100vw;
            padding: 20px;
            text-align: right;
            font-size: 18px;
            color: var(--highlight-color);
        }

        footer a,
        footer a:hover,
        footer a:active {
            color: var(--highlight-color);
        }
    </style>

</head>

<body>
    <canvas id="glcanvas" width="100" height="100" tabindex="1"></canvas>

    <libs></libs>
    <script type="text/javascript" src="./js/patch.js" async></script>
    <corelibs></corelibs>

    <script>
        // disable rubberband effect on mobile devices
        document.getElementById('glcanvas').addEventListener('touchmove', (e)=>{ e.preventDefault(); }, false);

        

        var fxrand1 = Math.floor(fxrand() * 150); //colour pallete
        var fxrand2 = fxrand() < 0.9; //point shape
        var fxrand3 = Math.floor(fxrand() * 5) + 7; //point size
        var fxrand4 = Math.floor(fxrand() * 20) + 1; //area rotate strength
        var fxrand5 = Math.floor(fxrand() * 20) + 1; //area rotate size
        var fxrand6 = Math.floor(fxrand() * 25) + 1; //deform area strength
        var fxrand7 = Math.floor(fxrand() * 5) + 1; //deform area size
        var fxrand8 = Math.floor(fxrand() * 250) + 1; //bend rotate X
        var fxrand9 = Math.floor(fxrand() * 250) + 1; //bend amount
        var fxrand10 = Math.floor(fxrand() * 3); //twist axis index
        var fxrand11 = Math.floor(fxrand() * 30) + 1; //twist height
        var fxrand12 = Math.floor(fxrand() * 360) + 1; //twist degree
        var fxrand13 = Math.floor(fxrand() * 5) - 2; //translate z
        var fxrand14 = Math.floor(fxrand() * 3) + 4; //translate y
        var fxrand15 = Math.floor(fxrand() * 50) + 1; //twist2 height
        var fxrand16 = Math.floor(fxrand() * 360) + 1; //twist2 degree
        var fxrand17 = Math.floor(fxrand() * 6) + 1; //circle trans radius
        var fxrand18 = Math.floor(fxrand() * 11) + 2; //circle trans segments
        var fxrand19 = fxrand() < 0.95; //Add lines
    
        
        
        // Features
        function a() {
    return fxrand3;
}
        function b() {
    return fxrand17;
}
        
        function c() {
    return fxrand1;
}
        function d() {
    return fxrand18;
}
        function e() {
            if (fxrand2 == false) return "Squares"
            else return "Circles";
            
}

        function f() {
    return fxrand7;
}
        function g() {
            if (fxrand10 == 0) return "X"
            if (fxrand10 == 1) return "Y"
            if (fxrand10 == 2) return "Z";
        }
        function h() {
    return (75000*fxrand18);
        }
        function i() {
            if (fxrand19 == false) return "True"
            else return "False";
        }

        
        function patchInitialized(patch) {
            // You can now access the patch object (patch), register variable watchers and so on
        }

        function patchFinishedLoading(patch) {
            // The patch is ready now, all assets have been loaded
        }
        
        
        window.$fxhashFeatures = {
        "Point Size": a(),
        "Point Type": e(),
        "Point Count": h(),
        "Colour Palette Index": c(),
        "Segments": d(),
        "Segment Size": b(),
        "Area Deform Size": f(),
        "Axis Twist Index": g(),
        "Added Lines": i(),

        }

        document.addEventListener('CABLES.jsLoaded', function (event) {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,
                prefixAssetPath: '',
                glCanvasId: 'glcanvas',
                glCanvasResizeToWindow: true,
                onPatchLoaded: patchInitialized,
                onFinishedLoading: patchFinishedLoading,
                canvas:{preserveDrawingBuffer:true}
            });
            CABLES.patch.setVariable("fxrand1",fxrand1)
            CABLES.patch.setVariable("fxrand2",fxrand2)
            CABLES.patch.setVariable("fxrand3",fxrand3)
            CABLES.patch.setVariable("fxrand4",fxrand4)
            CABLES.patch.setVariable("fxrand5",fxrand5)
            CABLES.patch.setVariable("fxrand6",fxrand6)
            CABLES.patch.setVariable("fxrand7",fxrand7)
            CABLES.patch.setVariable("fxrand8",fxrand8)
            CABLES.patch.setVariable("fxrand9",fxrand9)
            CABLES.patch.setVariable("fxrand10",fxrand10)
            CABLES.patch.setVariable("fxrand11",fxrand11)
            CABLES.patch.setVariable("fxrand12",fxrand12)
            CABLES.patch.setVariable("fxrand13",fxrand13)
            CABLES.patch.setVariable("fxrand14",fxrand14)
            CABLES.patch.setVariable("fxrand15",fxrand15)
            CABLES.patch.setVariable("fxrand16",fxrand16)
            CABLES.patch.setVariable("fxrand17",fxrand17)
            CABLES.patch.setVariable("fxrand18",fxrand18)
            CABLES.patch.setVariable("fxrand19",fxrand19)
            
        });
    </script>
</body>

</html>
