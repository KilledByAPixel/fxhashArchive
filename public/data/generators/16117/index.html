<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=2.0">
  <title>NAZCA, Kim Asendorf, 2022</title>
  <meta name="author" content="Kim Asendorf">
  <meta name="description" content="Real time animation series by Kim Asendorf, 2022">
  <meta name="keywords" content="glsl, webgl, shader, pixel, art">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👽</text></svg>">
  <link href="style.css" rel="stylesheet">
  <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
</head>
<body>
  <div id="screen"></div>
  <div id="loading">
    <div>Loading...</div>
  </div>
  <div id="preview">
    <div id="container">
      <div id="main-glyph"></div>
      <div id="main-horizontal">
        <div id="main-glyph-horizontal-b" class="horizontal-glyph"></div>
        <div id="main-glyph-horizontal-a" class="horizontal-glyph"></div>
      </div>
      <div id="main-vertical">
        <div id="main-glyph-vertical-b" class="vertical-glyph"></div>
        <div id="main-glyph-vertical-a" class="vertical-glyph"></div>
      </div>
      <div id="l2-l3-glyphs"></div>
      <div id="zoom"></div>
      <div id="l2-grid"></div>
    </div>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
