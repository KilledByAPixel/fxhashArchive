    All drawing and geometric methods written by mrkswcz except for the following:

    - For pseudorandom terrain generation, I adapted Hydraulic-Erosion by Sebastian
    Lague. The decision was inspired by Reconnaissance by TENDER x Nat Sarkissian.
    (MIT License)

    - For finding paths that simulate connections in terrain and potential locations
    of cities, I adapted a C# script from the article Pathfinding Algorithms in C#
    by Kristian Ekman published in Code Project licensed under The Code Project Open
    License (CPOL). The code was translated to javascript and simplified for
    performance.

    - Many pseudorandom effects are achieved with perlin-simplex by David Guttman
    and seedrandom by David Bau (both MIT Licenses)

    The event of heat death is our small tribute to fxhash project by lunarean. The
    code that generates the disintegration effect is an interpretation of a fragment
    of the original code. My contributions are its adaptation for 3d transformations
    and its recursive character that modifies certain parameters in time.

    For more information, please see the ./bundle.js.LICENSE.txt file included in
    the package.

    "><script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
