    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

const randomSeeded = (a=1, b=0) =>
{
    randomSeed ^= randomSeed << 13; randomSeed ^= randomSeed >>> 17; randomSeed ^= randomSeed << 5; // xorshift
    return b + (a-b) * Math.abs(randomSeed % 1e9) / 1e9;
}
const randomSeededSign = _ => randomSeeded() > .5 ? 1 : -1;

class Color
{
    constructor(h=0, s=1, l=1, a=1)
    {
        this.h = h;
        this.s = s;
        this.l = l;
        this.a = a;
    }

    mutate(max=.05, min=0) 
    {
        return new Color(
            this.h + randomSeeded(max, min)* randomSeededSign(),
            this.s + randomSeeded(max, min)* randomSeededSign(),
            clamp(this.l + randomSeeded(max, min)* randomSeededSign(), .1, 1),
            this.a
        );
    }

    setH(h) { return new Color(h, this.s, this.l, this.a ); }
    setS(s) { return new Color(this.h, s, this.l, this.a ); }
    setL(l) { return new Color(this.h, this.s, l, this.a ); }
    setA(a) { return new Color(this.h, this.s, this.l, a ); }

    getCSS()      
    { 
        return `hsla(${mod(this.h)*360|0},${clamp(this.s)*100|0}%,${clamp(this.l)*100|0}%,${clamp(this.a)})`; 
    }

    lerp(color, percent) 
    {
        return new Color(
            lerp(percent, this.h + color.h),
            lerp(percent, this.s + color.s),
            lerp(percent, this.l + color.l),
            lerp(percent, this.a + color.a)
        );
    }
}

// zzsprite code

let colorCount = 0;
let pixelCount = 0;
let maxLength = 0;
function ZzSprite(context, x=0, y=0, size=16)
{
    function DrawSpriteInternal(x, y, outline, depth)
    {
        let usedColor;
        randomSeed = mainSeed;
        y -= size/4+(1-2*yBias)*h/8;
        //context.fillStyle='red';context.fillRect(x,y,.1,.1)
        colorCount = 0;
        pixelCount = 0;
        // draw each pixel
        for(let k=0; k < w*h; ++k)
        {
            const i = flipAxis  ? k/w|0 : k%w;
            const j = !flipAxis ? k/w|0 : k%w;

            // pick new random color using color seed
            const saveSeed = randomSeed;
            
            let newColor;
            
            if (isMonochrome)
                newColor = monochromeColor.setL(randomSeeded(.1, 1));
            else
                newColor = new Color(randomSeeded(), randomSeeded()**.5, randomSeeded(.2, 1));
            if (outline)
            {
                let l = depth/3;
                let s = 1;
                let h = outlineColor.h;
                if (outlineColorID == 0)
                {
                    s = 0;
                    l = depth/3;
                }
                else if (outlineColorID == 1)
                {
                    s = 0;
                    l = 1-depth/2;
                }
                else if (isRainbowOutline)
                {
                    let h1 = randomSeeded();
                    let h2 = randomSeeded();
                    if (h1 < h2)
                    {
                        h = h1;
                        h1 = h2;
                        h2 = h;
                    }

                    h = lerp(depth, h1, h2);
                    s = 1;
                    l = depth*.6;
                }
                newColor = new Color(h,s,l);
                context.fillStyle = newColor.getCSS();
            }
            else if (!k || randomSeeded() < colorRand)
            {
                usedColor = 0;
                const gradient = context.createLinearGradient(
                    0, c.height/2 + (y-1)*cameraScale, 0, c.height/2 + (y+size)*cameraScale);
                gradient.addColorStop(0, newColor.mutate(isMonochrome ? .05 : .3).getCSS());
                gradient.addColorStop(.5, (newColor).getCSS());
                gradient.addColorStop(1, newColor.mutate(isMonochrome ? .05 : .3).getCSS());
                context.fillStyle = gradient;
            }
            
            randomSeed = saveSeed;

            // check if pixel should be drawn
            let r = randomSeeded(spriteSize/2)**2;
            let r2 = randomSeeded(spriteSize/2)**2;
            let r3 = randomSeeded();

            if (S(r+S(Math.PI*(animationTime*3|0)/4)/6)**2*spriteSize*2 > i*i + (j-(1-2*yBias)*h/2)**2)
            {
                let X1 = c.width/2 + (x+i-doubleCenter/2)*cameraScale;
                let X2 = c.width/2 + (x-i+doubleCenter/2)*cameraScale;
                let Y = c.height/2 + (y+j)*cameraScale;
                
                if (outline)
                {
                    const A = cameraScale*.4;
                    const B = cameraScale*1.3;
                    let P=Math.PI/2,b;
                    context.beginPath()
                    for(let f=4;f--;context.arc(X1+C(b=P/2-f*P)*B,Y+S(b)*B,A,b-=P/2,b+P));
                    context.fill()

                    if (glitch && r3<.5)
                        r = r2;
                    if (S(r+S(Math.PI*(animationTime*3|0)/4)/6)**2*spriteSize*2 > i*i + (j-(1-2*yBias)*h/2)**2)
                    {
                        context.beginPath()
                        for(let f=4;f--;context.arc(X2+C(b=P/2-f*P)*B,Y+S(b)*B,A,b-=P/2,b+P));
                        context.fill()
                    }
                }
                else
                {
                    context.fillRect(X1-cameraScale/2|0, Y-cameraScale/2|0, cameraScale, cameraScale);

                    if (glitch && r3<.5)
                        r = r2;
                    if (S(r+S(Math.PI*(animationTime*3|0)/4)/6)**2*spriteSize*2 > i*i + (j-(1-2*yBias)*h/2)**2)
                        context.fillRect(X2-cameraScale/2|0, Y-cameraScale/2|0, cameraScale, cameraScale);

                    ++pixelCount;
                    usedColor || ++colorCount;
                    usedColor = 1;
                }
            }
        }
    }

    // random chance to flip drawing axis
    const flipAxis = randomSeeded() < .5;
    const w =  flipAxis ? size-3 : size/2 - 1 |0;
    const h = !flipAxis ? size-3 : size/2 - 1 |0;
        
    // apply mutations
    const spriteSize = size;
    const density = randomSeeded(1, .8);
    const yBias = randomSeeded(.1, -.1);
    const colorRand = (isMonochrome ? .2 : .05);

    let shake = clickTime ? percent(time,clickTime+1,clickTime) : 0;
    shake *= S(time*20)*.5

    // outline then fill
    let count = 9;
    let yo = -S(bobTime)/2;

    for(let i=count+1;i--;)
    {
        let p = i/(count-1);
        let X = x-.8*(mouseX*2-1)*(i/count - .5) + shake-shake/4*(i/count -.7);
        let Y = y-.8*((mouseY)*2-1)*(i/count - .5)+yo-yo/2*(i/count -.6);
        DrawSpriteInternal(X, Y, 1, p);
        i || DrawSpriteInternal(X, Y, 0, p);
    }
}

let zzfxV=.2 // volume
let zzfx=    // play sound
