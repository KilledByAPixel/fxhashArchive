                color1 = new Color(h, randomSeeded(), randomSeeded(.8));
                color2 = new Color(h + randomSeeded(.4,.6), randomSeeded(), randomSeeded(.8));
            }

            gradient.addColorStop(0, color1.getCSS());
            gradient.addColorStop(.5, color.getCSS());
            gradient.addColorStop(1, color2.getCSS());
            x.fillStyle = gradient;
            x.fillRect(0,0,c.width,c.height);
        }
    }

    if (isStars)
    {
        x.globalCompositeOperation = 'lighter';

        x.fillStyle = '#fff';
        for(let i = 2e3; i--;)
        {
            let s = randomSeeded(isRainbow?10*S(time+randomSeeded(99)):5);
            x.fillStyle = (new Color(randomSeeded(), isRainbow? 1: randomSeeded(.5), randomSeeded())).getCSS();

            if (isRainbow)
                x.fillRect(randomSeeded(c.width),mod(-time*randomSeeded(99, 50) + randomSeeded(c.height+40),c.height+40)-20,s,s);
            else
                x.fillRect((time*randomSeeded(99, 50) + randomSeeded(c.width+40))%(c.width+40)-20,randomSeeded(c.height),s,s);
        }
    }

    x.globalCompositeOperation = 'source-over'

    ZzSprite(x,0,0, 12+size);

    //x.strokeStyle='#f00';x.lineWidth=.2;x.strokeRect(-.5,-.5,1,1);


    //x.font='2em"';x.fillStyle='#000';x.fillText('size: '+ sizeFeature + ' color: ' + backgroundColorFeature,22,99)

    if (glitch)
    {
        randomSeed = mainSeed;
        x.globalCompositeOperation = 'difference';

        const w = c.width;
        const h = c.height;
        for(let i=20;i--;)
        {
            let s = randomSeeded() < .5;
            x.fillStyle=R(randomSeeded(255),randomSeeded(255),randomSeeded(255))
            let X = S(randomSeeded(w)+time/20)*randomSeeded(w/4)+randomSeeded()**.1*randomSeededSign()*w/2+w/2;
            let Y = S(randomSeeded(h)+time/20)*randomSeeded(h/4)+randomSeeded()**.1*randomSeededSign()*h/2+h/2;
            let W = randomSeeded(w)*(s ? 1: .05);
            let H = randomSeeded(h)*(!s ? 1: .05);
            x.fillRect(X-W/2,Y-H/2,W,H);
        }

        
        x.globalCompositeOperation = 'source-over';
    }

} // end of dweet code

// zzsprite code

let colorCount = 0;
let pixelCount = 0;
let maxLength = 0;
function ZzSprite(context, x=0, y=0, size=16)
{
    function DrawSpriteInternal(x, y, outline, depth)
    {
        let usedColor;
        randomSeed = mainSeed;
        y -= size/4+(1-2*yBias)*h/8;
        //context.fillStyle='red';context.fillRect(x,y,.1,.1)
        colorCount = 0;
        pixelCount = 0;
        // draw each pixel
        for(let k=0; k < w*h; ++k)
        {
            const i = flipAxis  ? k/w|0 : k%w;
            const j = !flipAxis ? k/w|0 : k%w;

            // pick new random color using color seed
            const saveSeed = randomSeed;
            
            let newColor;
            
            if (isMonochrome)
                newColor = monochromeColor.setL(randomSeeded(.1, 1));
            else
                newColor = new Color(randomSeeded(), randomSeeded()**.5, randomSeeded(.2, 1));
            if (outline)
            {
                let l = depth/3;
                let s = 1;
                let h = outlineColor.h;
                if (outlineColorID == 0)
                {
                    s = 0;
                    l = depth/3;
                }
                else if (outlineColorID == 1)
                {
                    s = 0;
                    l = 1-depth/2;
                }
                else if (isRainbowOutline)
                {
                    let h1 = randomSeeded();
                    let h2 = randomSeeded();
                    if (h1 < h2)
                    {
                        h = h1;
                        h1 = h2;
                        h2 = h;
                    }

                    h = lerp(depth, h1, h2);
                    s = 1;
                    l = depth*.6;
                }
                newColor = new Color(h,s,l);
                context.fillStyle = newColor.getCSS();
            }
            else if (!k || randomSeeded() < colorRand)
            {
                usedColor = 0;
                const gradient = context.createLinearGradient(
                    0, c.height/2 + (y-1)*cameraScale, 0, c.height/2 + (y+size)*cameraScale);
                gradient.addColorStop(0, newColor.mutate(isMonochrome ? .05 : .3).getCSS());
                gradient.addColorStop(.5, (newColor).getCSS());
                gradient.addColorStop(1, newColor.mutate(isMonochrome ? .05 : .3).getCSS());
                context.fillStyle = gradient;
            }
            
            randomSeed = saveSeed;

            // check if pixel should be drawn
            let r = randomSeeded(spriteSize/2)**2;
            let r2 = randomSeeded(spriteSize/2)**2;
            let r3 = randomSeeded();

            if (S(r+S(Math.PI*(animationTime*3|0)/4)/6)**2*spriteSize*2 > i*i + (j-(1-2*yBias)*h/2)**2)
            {
                let X1 = c.width/2 + (x+i-doubleCenter/2)*cameraScale;
                let X2 = c.width/2 + (x-i+doubleCenter/2)*cameraScale;
                let Y = c.height/2 + (y+j)*cameraScale;
                
                if (outline)
                {
                    const A = cameraScale*.4;
                    const B = cameraScale*1.3;
                    let P=Math.PI/2,b;
                    context.beginPath()
                    for(let f=4;f--;context.arc(X1+C(b=P/2-f*P)*B,Y+S(b)*B,A,b-=P/2,b+P));
                    context.fill()

                    if (glitch && r3<.5)
                        r = r2;
                    if (S(r+S(Math.PI*(animationTime*3|0)/4)/6)**2*spriteSize*2 > i*i + (j-(1-2*yBias)*h/2)**2)
                    {
                        context.beginPath()
                        for(let f=4;f--;context.arc(X2+C(b=P/2-f*P)*B,Y+S(b)*B,A,b-=P/2,b+P));
                        context.fill()
                    }
                }
                else
                {
                    context.fillRect(X1-cameraScale/2|0, Y-cameraScale/2|0, cameraScale, cameraScale);

                    if (glitch && r3<.5)
                        r = r2;
                    if (S(r+S(Math.PI*(animationTime*3|0)/4)/6)**2*spriteSize*2 > i*i + (j-(1-2*yBias)*h/2)**2)
                        context.fillRect(X2-cameraScale/2|0, Y-cameraScale/2|0, cameraScale, cameraScale);

                    ++pixelCount;
                    usedColor || ++colorCount;
                    usedColor = 1;
                }
            }
        }
    }

    // random chance to flip drawing axis
    const flipAxis = randomSeeded() < .5;
    const w =  flipAxis ? size-3 : size/2 - 1 |0;
    const h = !flipAxis ? size-3 : size/2 - 1 |0;
        
    // apply mutations
    const spriteSize = size;
    const density = randomSeeded(1, .8);
    const yBias = randomSeeded(.1, -.1);
    const colorRand = (isMonochrome ? .2 : .05);

    let shake = clickTime ? percent(time,clickTime+1,clickTime) : 0;
    shake *= S(time*20)*.5

    // outline then fill
    let count = 9;
    let yo = -S(bobTime)/2;

    for(let i=count+1;i--;)
    {
        let p = i/(count-1);
        let X = x-.8*(mouseX*2-1)*(i/count - .5) + shake-shake/4*(i/count -.7);
        let Y = y-.8*((mouseY)*2-1)*(i/count - .5)+yo-yo/2*(i/count -.6);
        DrawSpriteInternal(X, Y, 1, p);
        i || DrawSpriteInternal(X, Y, 0, p);
    }
}
