		<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
		<style>
			html {
				height: 100%;
			}
			body {
				background-color: black;
				margin: 0;
				width: 100%;
				height: 100%;
				display: grid;
				place-items: center;
				overflow: hidden;
			}
			canvas {
				display: block;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<script type="module" type="">
			import { app, featureLabels } from './js.js'

			window.$fxhashFeatures = featureLabels

			console.log(featureLabels)

			// Desired scale and FPS can be passed as url parameters (0 = auto):
			const params = new URLSearchParams(location.search)
			const settings = {
				scale : parseInt(params.get('scale')) || 0,
				FPS   : parseInt(params.get('FPS')) || 0
			}

			app.boot(settings)

			window.addEventListener('keyup', e => {
				if        (e.key == 'i') {
					app.toggleInfo()
				} else if (e.key == 'f') {
					app.toggleFPS()
				} else if (e.key == 't') {
					app.exportTXT()
				} else if (e.key == 'p') {
					app.exportPNG(2)
				} else if (e.key == 'P') {
					app.exportPNG(4)
				} else if (e.key == 'ArrowUp') {
					app.toggleScale(1)
				} else if (e.key == 'ArrowDown') {
					app.toggleScale(-1)
				} else if (e.key == '0') {
					app.toggleScale(0)
				} else if (e.key == 'c') {
					document.style.cursor = document.style.cursor === 'none' ? 'auto' : 'none'
				}
			})
		</script>
	</body>
</html>
