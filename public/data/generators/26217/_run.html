n            if (dot3(cols[i],[.3,.59,.11])<dot3(cols2[j],[.3,.59,.11])) { cols2.splice(j,0,cols[i]); ins=1; break; }\n        }\n        if (ins==0) cols2.push(cols[i]);\n    }\n    return cols2;\n}\n\nfunction desaturate(col,fact) {\n    var br=(col[0]+col[1]+col[2])/3.;\n    col[0]=mymix(col[0],br,fact);\n    col[1]=mymix(col[1],br,fact);\n    col[2]=mymix(col[2],br,fact);\n}\n\nif (fxrand()>=.5) {\n   var c;\n   c=mix3(blackCol4,[0.,0.,0.],.5); for(var i=0;i<3;i++) blackCol4[i]=c[i];\n   c=mix3(   bgCol4,[.5,.5,.5],.5); for(var i=0;i<3;i++)    bgCol4[i]=c[i];\n   c=mix3(whiteCol4,[1.,1.,1.],.5); for(var i=0;i<3;i++) whiteCol4[i]=c[i];\n   for (col of [blackCol4,bgCol4,whiteCol4]) desaturate(col,.5); \n}\nif (fxrand()>=.0) { \n   var cols=sortByBright([blackCol4,bgCol4,whiteCol4]); \n   if(Math.abs(dot3(cols[0],[.33,.33,.33])-dot3(cols[1],[.33,.33,.33]))<.15) { cols[0][0]-=.15; cols[0][1]-=.15; cols[0][2]-=.15; }\n   if(Math.abs(dot3(cols[2],[.33,.33,.33])-dot3(cols[1],[.33,.33,.33]))<.15) { cols[2][0]+=.15; cols[2][1]+=.15; cols[2][2]+=.15; }\n   blackCol4=cols[0]; bgCol4=cols[1]; whiteCol4=cols[2]; \n   if(fxrand()<.1) {\n       //xchg lower 2 \n       blackCol4=cols[1]; bgCol4=cols[0];\n   }\n}\n\nfxh_bgBr = dot3(bgCol4,[.333,.333,.333]);\nvar fxh_whiteLev = dot3(bgCol4,[.333,.333,.333]);\n\nvar isspecialtheme=(fxrand()<.3);\nif (isspecialtheme) {\n   fxh_whiteLev=.63;\n   var ctheme=Math.floor(fxrand()*5.99);\n   if (ctheme==0.) {  // beige paper, blue ink, white\n       bgCol4   =[.77,.72,.52,.4];\n       blackCol4=[.0,.15,.4,.8];\n       whiteCol4=[1,1,1,1];\n   }\n   else if (ctheme==1.) {  // dark blue paper, black ink, gold\n       bgCol4   =[.15,.3,.45,.4];\n       blackCol4=[0,0,0,.8];\n       whiteCol4=[1,.67,.3,1];\n       fxh_metal=1.4;\n   }\n   else if (ctheme==2.) {  // red paper, black ink, gold\n       bgCol4   =[.7,.2,.1,.4];\n       blackCol4=[.0,0,0,.75];\n       whiteCol4=[1,.6,.25,1];\n       fxh_metal=1.4;\n   }\n   else if (ctheme==3.) { define WaveTex iChannel3\n#define NavTex iChannel2\n#include Include_Keys.glsl\n#include Include_Nav.glsl\n#include Include_Waves.glsl\n#include Include_Quat.glsl\n#include Include_A.glsl\n\n#define Res0 vec2(textureSize(iChannel0,0))\n#define Res1 vec2(textureSize(iChannel1,0))\n#define Res2 vec2(textureSize(iChannel2,0))\n#define Res3 vec2(textureSize(iChannel3,0))\n#define Res (iResolution.xy)\n//#define Afc (fragCoord-.5*Res)+.5*ARes\n\nfloat eps=.0003;\n\nfloat march(inout vec3 p, vec3 dir)\n{\n    float l=1.;\n    for(int i=0;i<180;i++){\n        float d=dist(p);\n        p+=dir*d*.35;\n        l+=d;\n        if (abs(d)<eps*l) return 1.;\n    }\n    return 0.;\n}\n\n#ifdef SHADEROO_VERTEX_SHADER\n#define discard {}\n#define fwidth(x) (.1*(x))\n#define dFdx(x) (.1*(x))\n#define dFdy(x) (.1*(x))\n#endif\n\nvec3 hsv2rgb(vec3 c)\n{\n    vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);\n    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);\n    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);\n}\n\nfloat htriSgn = -1.;\nfloat htri01(float x) // ampl [0..1], period 1\n{\n    return max(0.,(1.-fract(x)*2.)*htriSgn);\n}\n\nfloat tri01(float x) // ampl [0..1], period 1\n{\n    return abs(fract(x)*2.-1.);\n}\n\nfloat tri2_01(float f, float x)\n{\n    float lf=log2(f);\n    float f1=exp2(floor(lf));\n    float fact=fract(lf);\n    //float fact=f/f1-1.;\n    float t1=tri01(f1*x);\n    // general peak-mix of f , 2f\n    //float t2=tri01(f1*x-.5);\n    //return max(0.,t1*(1.+fact)-fact)+max(0.,t2*(1.+fact)-1.);\n    // only for triangle\n    return abs(t1*(1.+fact)-fact); // fade from tri01(f1*x) -> tri01(2f1*x)\n}\n\nfloat htri2_01(float f, float x)\n{\n    float lf=log2(f);\n    float f1=exp2(floor(lf));\n    float fact=fract(lf);\n    //float fact=f/f1-1.;\n    float t1=htri01(f1*x);\n    // general peak-mix of f , 2f\n    float t2=htri01(f1*x-.5);\n    return max(0.,t1*(1.+fact)-fact)+max(0.,t2*(1.+fact)-1.);\n}\n\nuniform float Carve;\n\nuniform float HatchSm;\n\nfloat pow2hatch(vec3 p, vec3 hdir, float hatchd, float br)\n{\n    float x=dot(p,hdir);\n    //float w2=abs(dot(dFdx(p),hdir))+abs(dot(dFdy(p),hdir));\n    float w2=fwidth(dot(p,hdir));\n    float tr=tri2_01(.5/hatchd/w2,x);\n    float w=HatchSm*fwidth(tr+br);\n    float pat;\n    pat=smoothstep(-.5*w,.5*w,tr-1.+br);\n    //pat=step(1.,tr+br);\n    return pat;\n}\n\nfloat pow2hatchHalf(vec3 p, vec3 hdir, float hatchd, float br)\n{\n    float x=dot(p,hdir);\n    //float w2=abs(dot(dFdx(p),hdir))+abs(dot(dFdy(p),hdir));\n    float w2=fwidth(dot(p,hdir));\n    float tr=htri2_01(.5/hatchd/w2,x);\n    float w=HatchSm*fwidth(tr+br);\n    float pat;\n    pat=smoothstep(-.5*w,.5*w,tr-1.+br);\n    //pat=step(1.,tr+br);\n    return pat;\n}\n\nuniform float BGRough;\n#ifdef VEC_COLS\nuniform vec3 BGCol;\nuniform vec3 BlackCol;\nuniform vec3 WhiteCol;\n#else\nuniform float BGColR;\nuniform float BGColG;\nuniform float BGColB;\n#define BGCol vec3(BGColR,BGColG,BGColB)\nuniform float BlackColR;\nuniform float BlackColG;\nuniform float BlackColB;\nuniform float BlackAlpha;\n#define BlackCol vec3(BlackColR,BlackColG,BlackColB)\nuniform float WhiteColR;\nuniform float WhiteColG;\nuniform float WhiteColB;\nuniform float WhiteAlpha;\n#define WhiteCol vec3(WhiteColR,WhiteColG,WhiteColB)\n#endif\nuniform float HatchW;\nuniform float Metal;\nuniform float MetalBlack;\nuniform float MetalBg;\nuniform float MetalBump;\nuniform float Hatch2;\nuniform float ThreeColors;\nuniform float FrameW;\nuniform float FrameSm;\nuniform float FrameErr;\nuniform float FrameVis;\nuniform float FrameDist;\nuniform float BrightMode;\nuniform float BlackShiny;\nuniform float Bumpy;\nuniform float CarvePseu;\nuniform float WhiteLev;\nuniform float Gap;\nuniform float ContentFrame;\nuniform float FrameRadial;\n\nfloat map01(float x, float x0, float x1) { return (abs(x1-x0)<.0001)?.5:(x-x0)/(x1-x0); }\nfloat boxfunc_excl(float x, float x0, float x1) { if (x<=x0 || x>=x1) return 0.; return 1.; }\nfloat boxfunc_incl(float x, float x0, float x1) { if (x<x0 || x>x1) return 0.; return 1.; }\nfloat boxfunc(float x, float x0, float x1) { return boxfunc_excl(x,x0,x1); }\n\nvoid mainImage( out vec4 fragColor, in vec2 fragCoord )\n{\n    float FrameW1=mix(FrameW,-10.,View360);\n    //vec4 raa=texelFetch(iChannel0,(ivec2(fragCoord)+iFrame*ivec2(17,47))&0xFF,0);\n    //fragCoord.xy+=(raa.xy-raa.zw)*.5;\n    float CarveX=Carve*(CarvePseu>0.?0.:1.);\n    vec2 fc0=fragCoord;\n    fragCoord=mix(fragCoord-.5*Res+.5*ARes,fragCoord,View360);\n    float scale=1.;\n    vec4 rr0 = textureLod(RandTex,ROTM(-1.)*(fc0.xy*1.1*scale/256.)*vec2(1,1),0.);\n    vec4 rr = rr0-textureLod(RandTex,ROTM(-1.)*((fc0.xy*1.1*scale+vec2(1,-1)*1.5)/256.)*vec2(1,1),0.).xwyz;\n    vec2 uv=fragCoord.xy/ARes;\n    vec2 uvr=fragCoord.xy/min(ARes.x,ARes.y);\n    vec4 r=textureLod(iChannel0,uvr*ROTM(1.)*.15,0.)-.5;\n    vec4 r2=textureLod(iChannel0,uvr*ROTM(-.5)*.08,0.)-.5;\n    \n    vec3 pos=vec3(0),pos0=vec3(0),dir=vec3(0),dir0=vec3(0);\n    getTrafo(pos,dir0,ARes*.5);\n    getTrafo(pos,dir,fragCoord);\n    g_enableSky=false;\n    for(int i=0;i<8;i++) if(distSkyCl(pos)<.1) { pos.z+=(distSkyCl(pos)-.1)*.5; }\n    for(int i=0;i<4;i++) if(dist   (pos)<.1) { pos.z-=(dist(pos)-.1)*1.; }\n    for(int i=0;i<4;i++) if(distSkyCl(pos)<.1) { pos.z-=.07; }\n    for(int i=0;i<4;i++) if(dist   (pos)<.1) { pos.z+=.2; }\n\n    //for(int i=0;i<10;i++) { if(distSky(pos)>0.) break; pos.z-=dist(pos); }\n    Camera cam=readCamera();\n    States st=readStates();\n    if(st.navMode==1.) {\n        pos=cam.pos;\n        vec2 sc=(fragCoord.xy-ARes.xy*.5)/(FovY<.5?ARes.x:ARes.y)*2.;\n        float vel=length(cam.vel);\n        sc=fishify(sc,Fisheye-vel*length(vel)/.05/.05);\n        dir=normalize(vec3(sc,1./tanFOVh)).xzy;\n        //dir=mix(dir,getDir360(fc0),View360);\n        dir=transformVecByQuat(dir,inverseQuat(cam.quat));\n    }\n\n    float aspect=ARes.y/ARes.x;\n    float FrameW2=FrameW1/sqrt(aspect);\n    float FrameSm2=FrameSm/sqrt(aspect);\n    \n    { // dir distortion\n        float dwin;\n        dwin=max(\n            (smoothstep(1.-FrameW1-FrameSm*.5, 1.-FrameW1+FrameSm*3., abs(uv.x-.5+FrameErr*r.x)*2.)),\n            (smoothstep(1.-FrameW2-FrameSm2*.5,1.-FrameW2+FrameSm2*3.,abs(uv.y-.5+FrameErr*r.y)*2.))\n            );\n        \n        dir+=dwin*r.xyz*.05*FrameDist;\n        dir+=dwin*r2.xyz*.1*FrameDist;\n    }\n    \n    pos0=pos;\n    g_enableSky=true;\n    for(int i=0;i<4;i++) if(dist(pos)<.0) { pos+=dist(pos)*dir0*1.; }\n    g_enableSky=!(dir.z<0. && pos.z<2.+SkyH*2.-1.);\n    //g_enableSky=true;\n    float hit=march(pos,dir);\n    bool isSky=(dist(pos)==distSky(pos));\n    vec3 n=normalize(getGrad(pos,isSky?.05:eps*2.));\n    //fragColor.xyz = vec3(abs(n.z)*.35+.65);\n    fragColor.xyz = vec3(1);\n    g_enableSky=true;  // fixes ao bug\n    float ao=calcAOFromDist(pos, n);\n    g_enableSky=false;  // fixes ao bug\n    // sky darker\n    if(isSky) ao*=.6*exp(-(pos.z-SkyZ0)*.25);\n    //if(isSky) ao*=.65*exp(-(pos.z-SkyZ0)*.25)*n.z*n.z;\n    fragColor.xyz *= ao*ao;\n    float depth=length(pos-pos0);\n    \n    // brightness\n    float br;\n    float fd=10.+pos.z*pos.z*pos.z*.5*(isSky?1.:0.); // bigger fog depth for sky\n    //float fd=10.+15.*(isSky?1.:0.); // bigger fog depth for sky\n    fragColor.xyz=clamp(fragColor.xyz,0.,1.);\n    fragColor.xyz=mix(fragColor.xyz,vec3(.035),(1.-exp(-depth/fd*depth/fd)));\n\n    //fragColor.w=1.;\n    //return;\n\n    br=dot(fragColor.xyz,vec3(.3333));\n    br=clamp(br,0.,1.);\n    //br=1.-(1.-br)*(1.-br);\n    br=mix( \n        1.-(1.-br)*(1.-br),\n        sqrt(br)*1.2-.1,\n        BrightMode\n        );\n    \n    // paspartu\n    float brX=(abs(br*2.-1.)*2.-1.)*.03;\n    float maskX=smoothstep(1.-FrameW1-FrameSm, 1.-FrameW1+FrameSm, abs(uv.x-.5+FrameErr*r.x)*2.-brX*ContentFrame);\n    float maskY=smoothstep(1.-FrameW2-FrameSm2,1.-FrameW2+FrameSm2,abs(uv.y-.5+FrameErr*r.y)*2.-brX*ContentFrame);\n    float maskAll=1.-(1.-maskX)*(1.-maskY);\n    \n    // hatching\n    vec3 p=pos;\n    distortM(p);  // use distorted pos for hatching\n\n    br=clamp(br,0.0001,.9999);\n    \n    float contentMask=(1.-maskAll*(1.-FrameVis));\n    float contentMask2=mix(contentMask,1.,.5); // for some effects to be also visible in frame\n\n    float br2;\n    br2=br;\n    //[0..whiteLevel] inv -> black\n    br2=map01(br2,WhiteLev-.5*Gap,.0)*sign(WhiteLev-.5*Gap); \n    br2*=contentMask;\n    float blackmask=boxfunc(br2,0.,1.);\n    blackmask*=step(0.,br2);\n    float black=0.;\n    vec3 hdir1=vec3( 1,-1.,0);\n    vec3 hdir2=vec3(-1, 0, 1);\n    vec3 hdir3=vec3( 0, 1, 1);\n    float broff=2.*rr.y*BGRough*1.;\n    float hw=HatchW*sqrt(max(Res.x,Res.y)/1000.);\n    black+=(1.-Hatch2*.5)*clamp(pow2hatch(p,hdir1,hw,br2-broff),0.,1.);\n    black+=(   Hatch2*.5)*clamp(pow2hatch(p,hdir2,hw,br2-broff),0.,1.);\n    \n    float blackH=0.;\n    float db=0.;\n    vec3 dn1=vec3(0);\n    vec2 sc_hdir1=normalize(vec2(dFdx(dot(p,hdir1)),dFdy(dot(p,hdir1))));\n    vec2 sc_hdir2=normalize(vec2(dFdx(dot(p,hdir2)),dFdy(dot(p,hdir2))));\n\n    float black1=0.;\n    htriSgn = -1.;\n    db=       clamp(pow2hatchHalf(p,hdir1,hw,br2-broff*.5),0.,1.); black1+=db; blackH+=db; \n    dn1.xy-=sc_hdir1*db*db*htriSgn*CarveX*contentMask2;\n    db=Hatch2*clamp(pow2hatchHalf(p,hdir2,hw,br2-broff*.5),0.,1.); black1+=db; blackH+=db;\n    dn1.xy-=sc_hdir2*db*db*htriSgn*CarveX*Hatch2*contentMask2;\n\n    float black2=0.;\n    htriSgn = 1.;\n    db=       clamp(pow2hatchHalf(p,hdir1,hw,br2-broff*.5),0.,1.); black2+=db; //blackH+=db;\n    dn1.xy-=sc_hdir1*db*db*htriSgn*CarveX*contentMask2;\n    db=Hatch2*clamp(pow2hatchHalf(p,hdir2,hw,br2-broff*.5),0.,1.); black2+=db; //blackH+=db;\n    dn1.xy-=sc_hdir2*db*db*htriSgn*CarveX*Hatch2*contentMask2;\n    \n    \n    black=mix(black,black*.65+blackH*.65,CarvePseu*Carve);\n    \n    hdir1+=vec3(1,-1,1)*.1;\n    hdir2+=vec3(1,1,-1)*.1;\n    p*=1.3;\n    \n    //[whiteLevel..1.0] -> white\n    br2=br;\n    br2=map01(br2,WhiteLev+.5*Gap,1.)*sign(1.-(WhiteLev+.5*Gap));\n    br2*=contentMask;\n    float whitemask=boxfunc(br2,0.,1.);\n    float white=0.;\n    white+=(1.-Hatch2*.5)*clamp(pow2hatch(p,hdir1,hw,br2-broff),0.,1.);\n    white+=(   Hatch2*.5)*clamp(pow2hatch(p,hdir2,hw,br2-broff),0.,1.);\n    float whiteH=0.;\n    \n    float white1=0.;\n    htriSgn = -1.;\n    db=       clamp(pow2hatchHalf(p,hdir1,hw,br2-broff*.5),0.,1.); white1+=db; blackH+=db; \n    dn1.xy+=sc_hdir1*db*db*htriSgn*CarveX*contentMask2;\n    db=Hatch2*clamp(pow2hatchHalf(p,hdir2,hw,br2-broff*.5),0.,1.); white1+=db; blackH+=db;\n    dn1.xy+=sc_hdir2*db*db*htriSgn*CarveX*Hatch2*contentMask2;\n\n    float white2=0.;\n    htriSgn = 1.;\n    db=       clamp(pow2hatchHalf(p,hdir1,hw,br2-broff*.5),0.,1.); white2+=db; //blackH+=db;\n    dn1.xy+=sc_hdir1*db*db*htriSgn*CarveX*contentMask2;\n    db=Hatch2*clamp(pow2hatchHalf(p,hdir2,hw,br2-broff*.5),0.,1.); white2+=db; //blackH+=db;\n    dn1.xy+=sc_hdir2*db*db*htriSgn*CarveX*Hatch2*contentMask2;\n\n    vec4 r0 = (textureLod(RandTex,fragCoord.xy/ARes.x*.03,0.)-.5)*6.14;\n    vec3 dir_sc=normalize(vec3((fragCoord.xy-Res*.5)/Res.x,-.7));\n    vec3 n2;\n    n2=normalize(n*.3+vec3(0,0,1)+BGRough*2.*vec3(r.xy*.04+r2.yz*.08+rr.xy*.8,0)+.0001);\n    n =normalize(     vec3(0,0,1)+BGRough*2.*vec3(r.xy*.04+r2.yz*.08+rr.xy*.8,0)+.0001);\n    \n    n += dn1*1.5;\n    n=normalize(n+.0001);\n    \n    \n    vec3 R=reflect(dir_sc,n);\n    vec3 R2=reflect(dir_sc,n2);\n    \n    #undef iTime\n\n    vec3 lDir=vec3(sin(iTime*1.5*.06),cos(iTime*1.7*1.5*.06),1.);\n    //lDir.xy=normalize(iMouse.xy-iResolution.xy*.5);\n    lDir=normalize(lDir);\n    float diff=mix(1.,clamp((dot(n,lDir))*1.5,0.,1.),CarveX);\n    \n    vec3 bgCol=BGCol;\n    float fres=1.-abs(dot(n,R)); fres*=fres; fres=fres*.8+.2;\n    vec3 Rb=mix(R,R2,MetalBump);Rb=normalize(Rb+.0001);\n    vec4 rR =textureLod(RandTex,mysmoothUV((R.xy *.25+iTime*.03)*.02,vec2(256)),0.);\n    vec4 rRb=textureLod(RandTex,mysmoothUV((Rb.xy*.25+iTime*.03)*.02,vec2(256)),0.);\n    vec3 rCol =vec3(.7,.8,.9)*vec3(1)*(.4+1.4*(rR.xyz*.1 +rR.w*.9 ))+1.*pow(abs(dot(R ,lDir)),25.);\n    vec3 rCol2=vec3(.7,.8,.9)*vec3(1)*(.4+1.4*(rRb.xyz*.1+rRb.w*.9))+1.*pow(abs(dot(Rb,lDir)),25.);\n\n    vec3 blackCol=BlackCol*mix(vec3(1),rCol2,MetalBlack/**black*/)/*+fres*rCol*.5*BlackShiny*/;\n    vec3 whiteCol=WhiteCol*mix(vec3(1),rCol2,Metal/**white*/)+.0;\n    vec3 midCol=vec3(.89,.7,0)*1.2;\n    if(isnan(dot(bgCol,vec3(1))))    bgCol=vec3(.5);\n    if(isnan(dot(blackCol,vec3(1)))) blackCol=bgCol;\n    if(isnan(dot(whiteCol,vec3(1)))) whiteCol=bgCol;\n    if(isnan(dot(rCol,vec3(1))))     rCol=bgCol;\n    fragColor.xyz=bgCol*mix(vec3(1),rCol,MetalBg)+(rr.x*.8+rr.y*.2)*BGRough;\n    if(isnan(fragColor.x)) fragColor.xyz=vec3(0,1,0);\n\n    vec2 uva=abs(uv-.5)-.5;\n    float frfade=clamp( exp2(-(length(max(uva+FrameW1*.5+.1,0.0)) + min(max(uva.x,uva.y)+FrameW2*.5+.1,0.0) -.1)/.1), 0.,1.);\n    \n    fragColor.xyz=mix(fragColor.xyz, blackCol, black*BlackAlpha*1.3*frfade);\n    fragColor.xyz=mix(fragColor.xyz, whiteCol, white*WhiteAlpha*1.3*frfade);\n\n    fragColor.xyz=clamp(fragColor.xyz,0.,1.);\n    //fragColor.xyz=clamp((fragColor.xyz-.5)*1.5+.5,0.,1.);\n\n    // black shininess\n    fragColor.xyz+=black*rCol*fres*BlackShiny*(contentMask2);\n    \n    // carve diff lighting\n    fragColor.xyz*=mix(1.,diff,contentMask2);//*(max(white2,white1)-white2*white1)\n\n    float f=1.;\n    //fragColor.xyz=clamp(atan((fragColor.xyz*2.-1.)*f)/atan(f)*.5+.5,0.,1.);\n    \n    fragColor.w=1.;\n}\n\n###BEGIN:Include_Waves.glsl\n\n#define TIME_FROM_STATE\n//#define TIME_FROM_FRAME\n\n#ifdef TIME_FROM_FRAME\n#define iTime (float(iFrame)*.032)\n#endif\n#ifdef TIME_FROM_STATE\n#define iTime (readStates().animTime)\n#endif\n\n#define ODD_EVEN_TRI\n#define JIGGLE_TRIPOS\n#define SPH_ABB\n#define ENABLE_VIEW_360\n\n#define PIH 1.57079632679\n#define PI2 (1.57079632679*4.)\n#define XNUM (textureSize(WaveTex,0).x)\n#define YNUM (textureSize(WaveTex,0).y)\n\n#define ROTM(ang) mat2( cos( (ang) + PIH*vec4(0,1,-1,0) ) )\n\nuniform float Aspect;\n#define ARes min(vec2(iResolution.x,iResolution.x*Aspect),vec2(iResolution.y/Aspect,iResolution.y))\n\n\nfloat scfact=1.7;\n\n//#define Distort (sin(iTime)*.5+.5)\nfloat Distort=1.;\nfloat Alternate=1.;\n\n//#define Anim min(Anim0*(1.+30.*(keyToggled(_F)?1.:0.)),.2)\n#define Anim 1.\n\nuniform float ViewDist0;\nuniform float SkyH;\nuniform float Anim0;\nuniform float SkyAnim;\nuniform float WaveAnim;\nuniform float PhaseOffs;\nuniform float Phase2Offs;\nuniform float PosOffs0X;\nuniform float PosOffs0Y;\nuniform float PosOffs0Z;\n#define PosOffs0 vec3(PosOffs0X,PosOffs0Y,PosOffs0Z)\nvec3 posOffs0=vec3(0);\n#define PosOffs (PosOffs0+posOffs0)\nuniform float SkyMode;\nuniform float Edgy;\n\nfloat distortGen(inout vec3 p, float sc1, float sc0, float scfact, bool fwd)\n// sc1 is fixed so all varying things should start there the same\n{\n    float wanim=Anim*WaveAnim;\n    p-=PosOffs;\n    p.y-=iTime*1.3*wanim;\n    float d=0.;\n    vec3 p0=p;\n    \n    int num;\n    #define NUM_ANALYTIC \n    #ifdef NUM_ANALYTIC\n    num=int(ceil((log2(sc1/sc0))/log2(scfact))+.5);\n    sc0=exp2(log2(sc1)-log2(scfact)*float(num-1));\n    #else\n    num=0; \n    float scx; for(scx=sc1;scx>sc0;scx/=scfact) { num++; } sc0=scx*scfact;\n    #endif\n    \n    float ang,sg=1.,dsg=1.;\n    float dang=.3;\n    if(fwd && dsg<0.) sg=float((num)%2)*2.-1.;\n    float phase=0.;\n    float sc=fwd?sc0:sc1;\n    for(int i=0;i<num;i++)\n    {\n        //sc=sc1*pow(scfact,-(fwd?float(num-1-i):float(i)));\n        float ang=float(i)*dang;\n        if(fwd) ang=float(num-1-i)*dang;\n        ang*=-1.;\n        p.xy=ROTM(ang*sg)*p.xy;\n        p0=p;\n        phase=iTime*sc*wanim+PhaseOffs;\n        vec3 pc=p0;\n        pc=(floor(p0/sc+.5*vec3(0,1,0)+phase/PI2)-phase/PI2*vec3(0,1,0))*sc;\n        pc.x=0.;\n        pc.z=0.+(.1+.15*Edgy)*sc;\n        vec3 f=1.-smoothstep(0.,.5,abs((p0-pc)/sc));\n        f*=mix(sin(p0.x/sc*.5*PI2+0./sc*PI2)*.5+.5,.85,0.);\n        p.yz=ROTM((fwd?1.:-1.)*f.y*f.z*scfact*Distort)*(p0-pc).yz+pc.yz;\n        d+=p.z;\n        p.xy*=ROTM(ang*sg);\n        sg*=dsg;\n        sc*=fwd?scfact:(1./scfact);\n        // this speeds things up a lot (only for d=p.z !!)\n        if (abs(p.z)>sc) break;\n    }\n    p.y+=iTime*1.3*wanim;\n    p+=PosOffs;\n    return d;\n}\n\n\nvoid distortG(inout vec3 p) { distortGen(p,2.5,.02,scfact,true); }\nvoid distortM(inout vec3 p) { distortGen(p,2.5,.02,scfact,false); }\n\nuniform float FOV;\n\n#define tanFOVh tan(FOV*PI2/360.*.5)\nuniform float RotSpeed;\nuniform float Azim0;\nuniform float Elev0;\nuniform float Roll0;\nuniform float FovY;\nuniform float View360;\nuniform float View360Stereo;\n\nvec3 getDir360(vec2 fc) // x,y in floor plane, z up\n{\n    vec2 sc=fc/iResolution.xy*2.-1.;\n    float th=sc.y*PI2*.25;\n    float ph=sc.x*PI2*.5;\n    return vec3(vec2(cos(-ph-vec2(0,PI2*.25)))*cos(th),sin(th));\n}\n\nvoid getPosDir360stereo(vec2 fc, vec2 res, float eyesep, inout vec3 pos, inout vec3 dir) // x,y in floor plane, z up\n{\n    float eye=step(res.y*.5,fc.y)*2.-1.;\n    if (eyesep!=.0) { fc.y=mod(fc.y,res.y*.5); res.y*=.5; }\n    vec2 sc=fc/res*2.-1.;\n    float th=sc.y*PI2*.25;\n    float ph=sc.x*PI2*.5;\n    dir=vec3(vec2(cos(-ph-vec2(0,PI2*.25)))*cos(th),sin(th));\n    pos+=vec3(normalize(dir.yx)*vec2(-1,1),0)*eyesep*.5*eye;\n}\n\nuniform float Fisheye;\n\nvec2 fishify(vec2 sc, float fish) { return exp2(fish*(dot(sc,sc)*.5-.33))*sc; }\n\n#define Res (iResolution.xy)\nvoid getTrafo(inout vec3 pos, inout vec3 dir, vec2 fc, bool inv)\n{\n    vec2 sc=(fc-ARes.xy*.5)/(FovY<.5?ARes.x:ARes.y)*2.;\n    sc=fishify(sc,Fisheye);\n    dir=normalize(vec3(0,0,-1./tanFOVh)+vec3(sc,0));\n    dir.xy=ROTM(Roll0)*dir.xy;\n    pos=vec3(0);\n    \n    #ifdef ENABLE_VIEW_360\n    vec3 pos360=vec3(0), dir360=vec3(0);\n    //dir=mix(dir,getDir360(fc).xzy*vec3(1,1,-1),View360);\n    if (View360!=0.) \n    {\n    getPosDir360stereo(mod(fc-vec2(iResolution.x*.25,0),iResolution.xy), iResolution.xy, .03*View360Stereo, pos360, dir360);\n    dir=mix(dir,dir360.xzy*vec3(1,1,-1),View360);\n    pos=mix(dir,pos360.xzy*vec3(1,1,-1),View360);\n    }\n    #endif\n    \n    float ph = iMouse.x/Res.x*10.+Azim0;\n    //if (iMouse.x<.5) ph=.15*iTime+3.5;\n    ph+=iTime*RotSpeed*Anim;\n    //float th = iMouse.y/Res.y*10.+1.2;\n    float th = iMouse.y/Res.y*10.-Elev0;\n    //th=-1.57;\n    float camDist=ViewDist0*exp(-iMouseData.z/5000.);\n\n    if(inv)\n    {\n        pos+=vec3(0,0,camDist);\n        pos.yz=ROTM(th)*pos.yz;\n        dir.yz=ROTM(th)*dir.yz;\n        pos.xy=ROTM(ph)*pos.xy;\n        dir.xy=ROTM(ph)*dir.xy;\n    }\n    else\n    {\n        pos.xy=ROTM(-ph)*pos.xy;\n        pos.yz=ROTM(-th)*pos.yz;\n        pos.z-=camDist;\n    }\n}\n\nvoid getTrafo(inout vec3 pos, inout vec3 dir, vec2 fc)\n{\n    getTrafo(pos, dir, fc, true);\n}\n\nvoid getTrafo(inout vec3 pos)\n{\n    vec3 dir;\n    getTrafo(pos, dir, vec2(0), false);\n}\n\nvec4 mytextureLod(sampler2D s, vec2 uv, float lod)\n{\n    #ifndef TEX_INTERPOL_HIGH\n    return textureLod(s,uv,lod);\n    #endif\n    ivec2 r=textureSize(s,0);\n    vec2 c=uv*vec2(r)-.5;\n    vec2 f=c-floor(c);\n    f=smoothstep(0.,1.,f);\n    //f=1.-(1.-f)*(1.-f);\n    c=floor(c);\n    return mix(\n        mix(texelFetch(s,(ivec2(c)+ivec2(0,0))%r,0),texelFetch(s,(ivec2(c)+ivec2(1,0))%r,0),f.x),\n        mix(texelFetch(s,(ivec2(c)+ivec2(0,1))%r,0),texelFetch(s,(ivec2(c)+ivec2(1,1))%r,0),f.x),\n        f.y\n        );\n}\n\nvec3 rotZ(float ang, vec3 p) { return vec3(ROTM(ang)*p.xy,p.z); }\nvec3 rotX(float ang, vec3 p) { return rotZ(ang,p.yzx).zxy; }\n\nvec4 getRand(vec3 p) {\n    vec4 c=vec4(0);\n    ivec2 oz=ivec2(111,17);\n    vec3 f=fract(p);\n    for(int i=0;i<8;i++) {\n        ivec3 d=ivec3(i,i/2,i/4)%2;\n        vec3 f2=f; if ((i&1)==0) f2=1.-f2;\n        c+=texelFetch(RandTex,(ivec2(floor(p.xy))+d.xy+oz*d.z)%256,0)*f2.x*f2.y*f2.z;\n    }\n    return c;\n}\nvec4 getRand(int i) { ivec2 r=textureSize(RandTex,0); return texelFetch(RandTex,ivec2(i%r.x,(i/r.x)%r.y),0); }\n\nuniform float CloudSize;\n\nvec2 mysmoothUV(vec2 uv, vec2 res) {\n    //return uv;\n    uv=uv*res-.5;\n    vec2 uvf=floor(uv);\n    uv=uvf+smoothstep(0.,1.,uv-uvf);\n    return (uv+.5)/res;\n}\n\nfloat mysmin(float a, float b, float k)\n{  a+=k; b+=k; return ((a-k)*b*b+(b-k)*a*a-k*a*b)/(a*a+b*b); }\n\nfloat distSkyBlitz(vec3 pos)\n{\n    pos-=PosOffs;\n    float sp=SkyAnim;\n    vec3 pos0=pos;\n    pos.z*=2.;\n    float sc=CloudSize/4.;\n    vec4 rpos=textureLod(RandTex,mysmoothUV(pos.xy*20./sc*.001,vec2(256)),0.);\n    //vec4 rpos=mytextureLod(RandTex,pos.xy*20./sc*.001,0.);\n    pos +=rpos.zwx*vec3(.05,.05,.1)*sc*1.15;\n    float d=10000.;\n    sc=CloudSize;\n    float sc0=sc;\n    vec3 poff=vec3(vec2(iTime*sc*sp*Anim),0);\n    vec4 ri=getRand(4+int(pos.z/sc+.5))+.25/1.57*floor(pos.z/sc0+.5);\n    for(int i=0;i<3;i++) {\n        vec3 p=rotZ(.3*float(i)+ri.x*1.57,pos);\n        vec3 p1=p;\n        p1.z=max(0.,p1.z);\n        vec3 pi=floor((p1+poff)/vec3(sc,sc,sc0)+.5)*vec3(sc,sc,sc0)-poff;\n        float d1=length(p-pi)-sc*.35;\n        d=mysmin(d,d1,sc*.12)*.9;\n        sc*=.66;\n        ri=ri.wxyz;\n    }\n    return d;\n}\n\n#define SkyZ0 (2.+SkyH*2.)\n\nfloat distSky(vec3 p)\n{\n    vec3 ps=p-vec3(0,0,SkyZ0);\n    //vec4 r=mytextureLod(RandTex,(ps.xy/CloudSize*4.+vec2(-1,1)*iTime*Anim*SkyAnim)/250.,0.);\n    vec4 r=textureLod(RandTex,mysmoothUV((ps.xy/CloudSize*4.+vec2(-1,1)*iTime*Anim*SkyAnim)/250.,vec2(256)),0.);\n    float dsky=distSkyBlitz(ps);\n    if(SkyMode>.5) dsky=-(ps.z-((r.x*r.y+.5*r.z*r.w)-.5)*CloudSize/4.)*1.5;\n    return dsky;\n}\n\nfloat distSkyCl(vec3 p)\n{\n    return min(distSky(p),-(p.z-SkyZ0));\n}\n\nuniform float Cuts;\n\nbool g_enableSky=true;\n\nfloat dist(vec3 p)\n{\n    vec3 p0=p;\n    Alternate=1.;\n    Distort=1.;\n    distortM(p);\n    float d=p.z;\n    float dx = (abs(fract(p.x/.07)-.5)-.1)*.07;\n    d=mix(max(d,dx),d,1.-Cuts);\n    if (g_enableSky) return min(d,distSky(p0));\n    return d;\n}\n\nvec3 getGrad(vec3 p, float eps) \n{ \n    vec3 d=vec3(eps,0,0); \n    float d0=dist(p);\n    return vec3(dist(p+d.xyy)-d0,dist(p+d.yxy)-d0,dist(p+d.yyx)-d0)/eps; \n}\n\nfloat calcAOFromDist(vec3 p, vec3 n){\n    float ao=1.;\n    float sc=2.;\n    for(int i=0;i<18;i++) { ao*=.7+.3*clamp(dist(p+n*.66*sc)/sc,0.,1.2);  sc*=.5; if(sc<.03) break; }\n    return ao;\n}\n\n###BEGIN:Include_Keys.glsl\n\n#ifndef kbTex\n#define kbTex iChannel1\n#endif\n\n#define _A 0x41\n#define _B 0x42\n#define _C 0x43\n#define _D 0x44\n#define _E 0x45\n#define _F 0x46\n#define _G 0x47\n#define _H 0x48\n#define _I 0x49\n#define _J 0x4A\n#define _K 0x4B\n#define _L 0x4C\n#define _M 0x4D\n#define _N 0x4E\n#define _O 0x4F\n#define _P 0x50\n#define _Q 0x51\n#define _R 0x52\n#define _S 0x53\n#define _T 0x54\n#define _U 0x55\n#define _V 0x56\n#define _W 0x57\n#define _X 0x58\n#define _Y 0x59\n#define _Z 0x5A\n\n#define _a 0x61\n#define _b 0x62\n#define _c 0x63\n#define _d 0x64\n#define _e 0x65\n#define _f 0x66\n#define _g 0x67\n#define _h 0x68\n#define _i 0x69\n#define _j 0x6A\n#define _k 0x6B\n#define _l 0x6C\n#define _m 0x6D\n#define _n 0x6E\n#define _o 0x6F\n#define _p 0x70\n#define _q 0x71\n#define _r 0x72\n#define _s 0x73\n#define _t 0x74\n#define _u 0x75\n#define _v 0x76\n#define _w 0x77\n#define _x 0x78\n#define _y 0x79\n#define _z 0x7A\n\n#define _0     0x30\n#define _1     0x31\n#define _2     0x32\n#define _3     0x33\n#define _4     0x34\n#define _5     0x35\n#define _6     0x36\n#define _7     0x37\n#define _8     0x38\n#define _9     0x39\n\n#define _excl     0x21\n#define _dquote   0x22\n#define _par      0xA7\n#define _dollar   0x24\n#define _percent  0x25\n#define _and      0x26\n#define _div      0x2F\n#define _lbrack   0x28\n#define _rbrack   0x29\n#define _equal    0x3D\n\n#define _hat      0x5E\n#define _quote    0x27\n#define _plus     0x2B\n#define _hash     0x23\n#define _lt       0x3C\n#define _comma    0x2C\n#define _dot      0x2E\n#define _minus    0x2D\n\n#define _mul      0x2A\n#define _gt       0x3E\n#define _semicolon 0x3B\n#define _colon    0x3A\n#define _underscore 0x5F\n#define _quest    0x3F\n\n#define _lcbrack 0x7B\n#define _rcbrack 0x7D\n#define _lsbrack 0x5B\n#define _rsbrack 0x5D\n#define _or      0x7C\n#define _backslash 0x5C\n#define _tilde   0x7E\n#define _at      0x40\n#define _unquote 0x60\n\n#define _space     0x20\n\n#define _deg    0xB0\n#define _ss     0xDF\n#define _ue     0xFC\n#define _oe     0xF6\n#define _ae     0xE4\n#define _UE     0xDC\n#define _OE     0xD6\n#define _AE     0xC4\n#define _euro   0x20AC\n#define _mu     0x3BC\n\n#define _bs     0x08\n#define _tab     0x09\n#define _enter     0x0D\n\n#define _shift     -1\n#define _alt       -2\n#define _ctrl      -3\n\n#define _PLUS  187\n#define _MINUS 189\n#define _LEFT   37\n#define _RIGHT  39\n#define _DOWN   40\n#define _UP     38\n\nfloat getKB(int key)\n{\n    return texelFetch(kbTex,ivec2(key,0),0).x;\n}\n\nfloat getKB1(int key)\n{\n    return texelFetch(kbTex,ivec2(key,1),0).x;\n}\n\nfloat getKB2(int key)\n{\n    return texelFetch(kbTex,ivec2(key,2),0).x;\n}\n\nbool keyPressed(int key)\n{\n    return getKB(key)>0.5;\n}\n\nbool keyToggled(int key)\n{\n    return getKB2(key)>0.5;\n}\n\n###BEGIN:Include_Nav.glsl\n\n#define FastMode (keyToggled(_F)?1.:0.)\n\n#define CamHistPix0 64\n#define PixPerCam 4\n\nvec4 readPixel(sampler2D s, int idx) {\n    ivec2 r=textureSize(s,0);\n    return texelFetch(s,ivec2(idx,idx/r.x)%r,0);\n}\n\nstruct Camera {\n    vec3 pos;\n    vec4 quat;\n    vec3 vel;\n    vec3 angVel;\n};\n\nstruct States {\n    float animTime;\n    float anim;\n    float navMode;\n    float useDate;\n    float viewDist;\n    float viewTh;\n    float viewPh;\n};\n\nCamera readCamera(int pix0){\n    Camera c;\n    c.pos   =readPixel(NavTex,pix0+0).xyz;\n    c.quat  =readPixel(NavTex,pix0+1);\n    c.vel   =readPixel(NavTex,pix0+2).xyz;\n    c.angVel=readPixel(NavTex,pix0+3).xyz;\n    return c;\n}\n\nCamera readCamera(){ return readCamera(1); }\n\nCamera readCameraHist(int idx) { return readCamera(CamHistPix0+idx*PixPerCam); }\n\nvoid writeCamera(Camera c, inout vec4 col, vec2 coord, int pixOffs){\n    int pixIdx=int(coord.x)+int(coord.y)*textureSize(NavTex,0).x;\n    if(pixIdx==pixOffs  ) col.xyz = c.pos;\n    if(pixIdx==pixOffs+1) col     = c.quat;\n    if(pixIdx==pixOffs+2) col.xyz = c.vel;\n    if(pixIdx==pixOffs+3) col.xyz = c.angVel;\n}\n\nvoid writeCamera( Camera c, inout vec4 col, vec2 coord) { writeCamera(c,col,coord,1); }\n\nStates readStates(int pix0){\n    States s;\n    vec4 p;\n    p=readPixel(NavTex,pix0+0);\n    s.anim    = p.x;\n    s.navMode = p.y;\n    s.useDate = p.z;\n    s.animTime = p.w;\n    p=readPixel(NavTex,pix0+1);\n    s.viewDist = p.x;\n    s.viewTh   = p.y;\n    s.viewPh   = p.z;\n    return s;\n}\n\nStates readStates(){ return readStates(1+PixPerCam); }\n\nvoid writeStates(States s, inout vec4 col, vec2 coord, int pixOffs){\n    int pixIdx=int(coord.x)+int(coord.y)*textureSize(NavTex,0).x;\n    if(pixIdx==pixOffs  ) col = vec4( s.anim, s.navMode, s.useDate, s.animTime );\n    if(pixIdx==pixOffs+1) col = vec4( s.viewDist, s.viewTh, s.viewPh, 1. );\n}\n\nvoid writeStates(States s, inout vec4 col, vec2 coord){ writeStates(s,col,coord,1+PixPerCam); }\n\n###BEGIN:Include_Quat.glsl\n\n\n#ifndef PI2\n#define PI2 (3.141592653*2.)\n#endif\n\nvec4 multQuat(vec4 a, vec4 b)\n{\n    return vec4(cross(a.xyz,b.xyz) + a.xyz*b.w + b.xyz*a.w, a.w*b.w - dot(a.xyz,b.xyz));\n}\n\nvec3 transformVecByQuat( vec3 v, vec4 q )\n{\n    return v + 2.0 * cross( q.xyz, cross( q.xyz, v ) + q.w*v );\n}\n\nvec4 angVec2Quat(vec3 ang)\n{\n    float lang=length(ang);\n    return vec4(ang/lang,1) * sin(vec2(lang*.5)+vec2(0,PI2*.25)).xxxy;\n}\n\nvec4 axAng2Quat(vec3 ax, float ang)\n{\n    return vec4(normalize(ax),1) * sin(vec2(ang*.5)+vec2(0,PI2*.25)).xxxy;\n}\n\nvec4 inverseQuat(vec4 q)\n{\n    //return vec4(-q.xyz,q.w)/length(q);\n    // if already normalized this is enough\n    return vec4(-q.xyz,q.w);\n}\n\nvec4 slerpQuat(vec4 q1, vec4 q2, float t)\n{\n    float q1q2 = dot(q1, q2);\n    if (q1q2 < 0.0) { q1q2=-q1q2; q2=-q2; } // if (cos(ang) < 0) -> ang>90 -> invert one quat\n    float ang = acos(q1q2);\n    return (q1*sin(ang*(1.0-t)) + q2*sin(ang*t))/sin(ang);\n}\n\nvec4 mirrorQuat(vec4 q, vec3 n)\n{\n    //rotate projector around axis which lying in mirror plane and is normal to projector x axis\n    //mirroring has to be done afterwards in x\n    // should be as simple as that: (rotating camera-x into mirror normal is exactly half the angle)\n    vec3 bx=transformVecByQuat(vec3(1,0,0),q);\n    vec3 axe=cross(bx,n);\n    vec4 qr=vec4(-axe,-sign(dot(n,bx))*sqrt(1.-dot(axe,axe)));\n    return multQuat(qr,q);\n}\n\nvec4 rotateQuatbyAngle(vec4 quat, vec3 angle)\n{\n    float angleScalar=length(angle);\n    if (angleScalar<0.00001) return quat;\n    return multQuat(quat,vec4(angle*(sin(angleScalar*0.5)/angleScalar),cos(angleScalar*0.5)));\n}\n\nvec3 quat2AngVec(vec4 q)\n{\n    //angh=atan(length(q.xyz),q.w);\n    return normalize(q.xyz)*acos(q.w)*2.;\n}\n\nvec4 mat2quat(mat3 m)\n{\n    float T=m[0].x+m[1].y+m[2].z+1.0;\n    if(T<0.0000001) return vec4(0.0,0.0,0.0,1.0);\n    //assuming positive trace\n    float S = 0.5/sqrt(T);\n    vec4 q;\n    q.w = 0.25/S;\n    q.x = (m[2].y-m[1].z)*S;\n    q.y = (m[0].z-m[2].x)*S;\n    q.z = (m[1].x-m[0].y)*S;\n    return q;\n}\n\nvec4 orientQuatZ(vec3 z)\n{\n    z=(length(z)>.0001)?normalize(z):vec3(0,0,1);\n    vec3 z0=vec3(0,0,1);\n    vec4 q;\n    // critical only when z=-z0\n    vec3 zh=normalize(z+z0);\n    q.xyz=cross(zh,z0);\n    q.w=dot(zh,z0);\n    return q;\n}\n\n\nvec4 quatFromBaseXYZ(vec3 X2, vec3 Y2, vec3 Z2) // FIXME: not working yet...\n{\n    //return mat2quat(transpose(mat3(X2,Y2,Z2)));\n    vec3 X=X2,Y=Y2,Z=Z2;\n    // do we need to transpose?\n    /*X=vec3(X2.x,Y2.x,Z2.x);\n    Y=vec3(X2.y,Y2.y,Z2.y);\n    Z=vec3(X2.z,Y2.z,Z2.z);*/\n    vec3 X0=vec3(1,0,0); \n    vec3
