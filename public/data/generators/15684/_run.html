      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }

const stableSort = (arr, compare) => arr

let blendModes = ['source-over','source-over','source-over','multiply','soft-light'];
function drawDithering(image) {
	return new Promise(async (resolve) => {
		let scale = 1.5;
		let scaleFromUrl = new URLSearchParams(window.location.search).get("scale");
		if (scaleFromUrl && !isNaN(parseFloat(scaleFromUrl))) {
			scale = parseFloat(scaleFromUrl);
		}
	
		ditheredCanvas.width = image.width*scale;
		ditheredCanvas.height = image.height*scale;
		
		let border = 65;

		if (fxrand() > 0.5) {
			// rewrite for weirder colors
			preset = pick(Object.keys(palettes))
			colors = palettes[preset];
		}
		console.log({preset});
		
		let ctx = ditheredCanvas.getContext('2d');
		ctx.lineCap = 'round';
		ctx.lineJoin = 'round';
		let backgroundColors = colors.map(color=>({brightness:getBrightnessFromHex(color), color}));
		stableSort(backgroundColors, (a,b)=>b.brightness-a.brightness);
		ctx.fillStyle = backgroundColors[range(0,3)|0].color;
		ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
		
		if (!monochromePresets.includes(preset)) {
			let gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
			let invGradient = fxrand() > 0.5;
			gradient.addColorStop(invGradient?0:1, backgroundColors[range(0,2)|0].color);
			gradient.addColorStop(invGradient?1:0, "#fff");
			ctx.fillStyle = gradient;
			ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
		}
		
		ctx.globalAlpha = range(0.825,0.975);
		ctx.fillStyle = !monochromePresets.includes(preset) || fxrand() > 0.75 ? "#f4f0e4" : "#fff";
		ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
		
		if (isMonochrome) {
			colors = backgroundColors.slice(backgroundColors.length-range(1,3)|0, backgroundColors.length-1).map(c=>c.color);
		} else {
			if (fxrand() > 0.5) colors = backgroundColors.map(c=>c.color);
		}
		
		let shifts = pick([0,1,2,3,4])|0;
		while(shifts--) colors.push(colors.shift());
		
		ctx.globalCompositeOperation = 'multiply';
		
		ctx.lineWidth = scale/2;
		
		ctx.globalAlpha = 0.95;
		const dithering = dither(image, ctx, pick(ditheringMethods), ditherScale);
		await iterOnAnimationFrame(dithering, ({x,y,r,color}) => {
			if (x > border && x < ctx.canvas.width/scale - border && y > border && y < ctx.canvas.height/scale - border) {
				x += range(0,0.5)*scale;
				y += range(0,0.5)*scale;
				
				ctx.strokeStyle = 
				ctx.fillStyle = `rgb(${color.join(",")})`;
				let shapeScale = clamp((r*r)/2+0.5,0,1)*scale*2 * (1/ditherScale);
				let angle = r*Math.PI*2 + (Math.sin(x/ctx.canvas.width) * y / ctx.canvas.height)*angleImpact;
				
				if (doCrossHatch && r > 0.5 && r < 0.6) {
					ctx.save();
					ctx.lineWidth = scale * r * 0.25;
					ctx.globalCompositeOperation = pick(blendModes);
					let angle = Math.sin(inverseLerp(0.5,0.6,r) * Math.PI*2);
					cross(ctx,x*scale,y*scale, shapeScale*range(1,15), angle);
					ctx.restore();
				}
				
				ctx.globalCompositeOperation = pick(blendModes);
				ctx.strokeStyle = ctx.fillStyle = colors[r*colors.length|0].color;
				r*=4;
				r=r%1;
				
				if (Math.round(r * strokeR) % 2 == 0) {
					if (r > 0.3) {
						ctx.lineWidth = scale * (r+range(-lineWidthRange,lineWidthRange)) * 2.5;
						stripe(ctx,x*scale,y*scale, shapeScale, angle);
					} else {
						ctx.lineWidth = scale * (r+range(-lineWidthRange,lineWidthRange));
						currentShapes[0](ctx,x*scale,y*scale, shapeScale, angle);
					}
				} else if (fxrand() > 0.9) {
					ctx.lineWidth = scale * clamp(r+range(-lineWidthRange,lineWidthRange), 0.4, 1) 
					if (r > 0.3 && r < 0.5) {
						currentShapes[2](ctx,x*scale,y*scale, shapeScale, angle);
					} else if (r < 0.7) {
						currentShapes[1](ctx,x*scale,y*scale, shapeScale, angle);
					} else {
						currentShapes[0](ctx,x*scale,y*scale, shapeScale, angle);
					}
				} else {
					pick(currentShapes)(ctx,x*scale,y*scale, shapeScale, angle);
				}
			}
		});
		
		resolve();
	});
}

function circle(ctx, x,y, size, angle, fill = false) {
	ctx.beginPath();
	ctx.arc(x, y, size, 0, Math.PI * 2);
	if (fill) ctx.fill();
	else ctx.stroke();
}

/** source: https://stackoverflow.com/a/45338002/508029 **/
function circleCircleIntercept(x1,y1,r1,x2,y2,r2){
    var x = x2 - x1;
    var y = y2 - y1;
    var dist = Math.sqrt(x * x + y * y);
    if(dist > r1 + r2 || dist < Math.abs(r1-r2)){
        return;
    }
    var a = (dist * dist - r1 * r1 + r2 *r2) / ( 2 * dist);
    var b = Math.sqrt(r2 * r2 - a * a);
    a /= dist;
    x *= a;
    y *= a;
    var mx = x2 - x;
    var my = y2 - y;
    dist = b / Math.sqrt(x * x + y * y);
    x *= dist;
    y *= dist;
    return {
       x1 : mx-y,
       y1 : my+x,
       x2 : mx+y,
       y2 : my-x,
    };
}

function moon(ctx,x1,y1,r1, angle, fill) {
	let x2 = x1 + r1 / range(3,4);
	let y2 = y1 - r1 / range(6,7);
	let r2 = r1 * range(0.7,1.2);

	let dist = Math.hypot(x2-x1,y2-y1);
    let ang = Math.atan2(y2-y1,x2-x1);
    let intercepts = circleCircleIntercept(x1,y1,r1,x1 + dist,y1,r2);    
    if (intercepts === undefined){
        ctx.beginPath();
        ctx.arc(x1, y1, r1, 0, Math.PI*2);
        if(dist < r1){
            ctx.moveTo(x2 + r2, y2);
            ctx.arc(x2, y2, r2, 0, Math.PI*2, true);
        }
        ctx.fill();
        return;
    }
    const p = intercepts;
    let startA1 = Math.atan2(p.y1 - y1, p.x1 - x1) + ang; 
    let endA1 = Math.atan2(p.y2 - y1, p.x2 - x1) + ang; 
    let startA2 = Math.atan2(p.y1 - y1, p.x1 - (x1 + dist)) + ang; 
    let endA2 = Math.atan2(p.y2 - y1, p.x2 - (x1 + dist)) + ang; 

    ctx.beginPath();
    if(endA1 < startA1){
        ctx.arc(x1, y1, r1, startA1, endA1);
        ctx.arc(x2, y2, r2, endA2, startA2, true);
    } else {
        ctx.arc(x2, y2, r2, endA2, startA2);    
        ctx.arc(x1, y1, r1, startA1, endA1,true);
    }
    ctx.closePath();
    ctx.fill();
}

function triangle(ctx, x, y, size, angle = 0, fill = false) {
	ctx.beginPath();
	for(let i=0;i<3;i++) {
		let a = angle + i/3 * Math.PI*2;
		if (i==0) ctx.moveTo(x + Math.sin(a)*size, y + Math.cos(a)*size);
		else ctx.lineTo(x + Math.sin(a)*size, y + Math.cos(a)*size);
	}
	ctx.closePath();
	if (fill) ctx.fill();
	else ctx.stroke();
}

let stripeRange = range(1,1.5);
function stripe(ctx, x, y, size, angle = 0, fill = false) {
	size *= stripeRange;
	let a1 = angle;
	let a2 = Math.PI/2 + angle;
	ctx.beginPath();
	ctx.moveTo(x-Math.sin(a1)*size, y-Math.cos(a1)*size);
	ctx.lineTo(x+Math.sin(a1)*size, y+Math.cos(a1)*size);
	ctx.stroke();
}

function cross(ctx, x,y,size, angle = 0, fill = false) {
	let a1 = angle;
	let a2 = Math.PI/2 + angle;
	ctx.beginPath();
	ctx.moveTo(x-Math.sin(a1)*size, y-Math.cos(a1)*size);
	ctx.lineTo(x+Math.sin(a1)*size, y+Math.cos(a1)*size);
	ctx.moveTo(x-Math.sin(a2)*size, y-Math.cos(a2)*size);
	ctx.lineTo(x+Math.sin(a2)*size, y+Math.cos(a2)*size);
	ctx.stroke();
}

function* dither(image, outputCtx, matrix, scale = 1) {
	// https://tannerhelland.com/2012/12/28/dithering-eleven-algorithms-source-code.html
	let inputCanvas = document.createElement('canvas');
	
	let w = inputCanvas.width = Math.round(image.width * scale);
	let h = inputCanvas.height = Math.round(image.height * scale);
	let invScale = 1 / scale;
	inputCtx = inputCanvas.getContext('2d');
	inputCtx.drawImage(image, 0, 0, w, h);
	
	let rawImageData = inputCtx.getImageData(0, 0, w, h);
	
	let ctx = ditheredCanvas.getContext('2d');
	
	let matrixOffset = matrix.data.indexOf("x");
	if (!matrix.height) matrix.height = matrix.data.length/matrix.width|0;
	if (!matrix.div) matrix.div = matrix.data.reduce((curr,value) => curr += isNaN(value) ? 0 : value, 0);
	let breakPoint = 1-96/255;
	for(let y1 = 0; y1 < h; y1 ++) {
		for(let x1 = 0; x1 < w; x1 ++) {
			let imageData = inputCtx.getImageData(x1 - matrixOffset, y1, matrix.width, matrix.height);
			let pixels = imageData.data;
			// let idx = ((x1 + matrixOffset) + y1 * w) * 4;
			let pixelBrightness = getBrightnessFromImageData(pixels, matrixOffset * 4);
			let pixel = pixelBrightness < breakPoint ? 0 : 1;
			let error = Math.floor((pixelBrightness - pixel) / matrix.div * 255);
			
			matrix.data.forEach((val,i) => {
				let x2 = i % matrix.width;
				let y2 = i / matrix.width | 0;
				let idx = (x2 + y2 * matrix.width) * 4;
				if (i != 0 && i > matrixOffset) {
					pixels[idx+0] = clamp(pixels[idx+0] + error * val);
					pixels[idx+1] = clamp(pixels[idx+1] + error * val);
					pixels[idx+2] = clamp(pixels[idx+2] + error * val);
				} else if (i < matrixOffset) {
					//pixels[idx + 4] = 0; // this maybe doesn't matter
				}
			});
			if (pixel < breakPoint) {
				let colorIdx = Math.floor(x1 + y1 * w) * 4;
				let r = rawImageData.data[colorIdx + 0];
				let g = rawImageData.data[colorIdx + 1];
				let b = rawImageData.data[colorIdx + 2];
				yield {x:x1*invScale, y:y1*invScale, r:getBrightnessFromRGB(r,g,b), color:[r,g,b]};
			}
			inputCtx.putImageData(imageData, x1 - matrixOffset, y1);
		}
	}
}

function createRibbon(map, length = totalLength) {
    var ribbon = new Ribbon();
    for(let i = 0;i<length;i++) {
        let t = i/length;
        ribbon.add(map(t));
    }
    return ribbon;
}

let startAngleFrom = range(0, Math.PI*2);

function getStripes(baseAngle) {
	let baseSin = range(10,80);
	let size = range(300,300);
	let useX = pick([0.5,1]);
	let useY = pick([0.5,1]);
	let waveX = pick([0,0.5,1]);
	let waveY = pick([0,0.5,1]);
	let rangeX = range(200,200);
	let rangeY = range(200,200);
	let lineSize = lineWidth + range(0,lineWidth*2);
	let a1 = baseAngle + Math.PI/2; 
	let a = [Math.sin(a1)*size, Math.cos(a1)*size];
	let b1 = a1 + Math.PI; 
	let b = [Math.sin(b1)*size, Math.cos(b1)*size];
	
	return {
		baseSin,
		size,
		useX, useY,
		waveX, waveY,
		rangeX, rangeY,
		a, b,
		lineWidth:lineSize
	}

}

let stripes = [];

stripes.push(getStripes(Math.PI/2));

stableSort(stripes, _ => -range(-1,1));

function* createShapes(ctx, totalRibbons) {
	for(let i=0;i<totalRibbons;i++) {
		let idx = i/totalRibbons;
		
		ctx.shadowColor = 'rgba(0,0,0,0.1)';
		ctx.shadowBlur = getValue(10);
		
		for (let stripe of stripes) {
			if (fxrand() > 0.99) continue;
			let sin = stripe.baseSin + range(-2,2);
			let ribbon = createRibbon(t => {
				let pos = lrp2(stripe.a, stripe.b, t);
				pos = add2(pos, [lrp(-stripe.rangeX,stripe.rangeX, idx) * stripe.useX, lrp(-stripe.rangeY,stripe.rangeY, idx) * stripe.useY]);
				pos[2] = (5+Math.sin(t*sin))*stripe.lineWidth / 10 * stripe.waveX;
				pos[3] = (5+Math.sin(t*sin))*stripe.lineWidth / 10 * stripe.waveY;
				return pos;
			});
			yield ribbon.getPath();
		}
	}

	ctx.lineWidth = canvas.width/30;
	
	// add big shapes
	let shapeColors = [pick(colors),pick(colors)];
	let shapes = [circle,circle,circle, triangle,triangle,triangle,triangle,triangle, moon];

	let totalShapes = (range(0,1) * range(0, 30))|0;
	let radiusses = Array.from({length:totalShapes}, (_,idx) => lerp(5, 30, idx/totalShapes));
	if (fxrand() > 0.5) {
		for(let size of radiusses) {
			let shape = pick(shapes);
			ctx.fillStyle = pick(shapeColors);
			let radius = canvas.width/size;
			shape(ctx, canvas.width/2 + (canvas.width-radius*3)/2*range(-1,1), canvas.height/2 + (canvas.width)/2*range(-1,1), radius, fxrand(), true);
			//shape(ctx, canvas.width/2, canvas.height/2, radius, fxrand(), true);
		}
	} else {
		let shape = pick(shapes);
		shape(ctx, canvas.width/2, canvas.height/2, pick(radiusses), fxrand(), true);
	}
	
	// outer rings
	for(let jj=0;jj<totalRibbons*2;jj++) {
		//if (fxrand() > 0.85) continue;
		let t = jj/ (totalRibbons*2);
		let size = lrp(minSize, maxSize, fxrand());
		if (border==1) size= lrp(minSize, maxSize, 1 - t);
		else if (border==2) size = lrp(minSize, maxSize, t);
		
		let startAngle = startAngleFrom+Math.PI/2 + range(-0.2, 0.2);
		let ribbon = createRibbon(t => [Math.sin(startAngle+t*Math.PI*2)*size, Math.cos(startAngle+t*Math.PI*2)*size, t * lineWidth + (1.1+Math.sin(t*20))*lineWidth / 5]);
		yield ribbon.getPath();
	}
}

function Ribbon() {
    class Ribbon {
        constructor() {
            this.points = [];
            this.left = [];
            this.right = [];
        }
        add(pos) {
            if (this.points.length >= 2) {
                let prevLast = this.points[this.points.length - 2];
                let last = this.points[this.points.length - 1];
                
                let prevDelta = sub2(prevLast, last);
                let prevDeltaNrm = nrm2(prevDelta);
                
                let delta = sub2(last, pos);
                let deltaNrm = nrm2(delta);
                
                let dot = dot2(deltaNrm, prevDeltaNrm);
                let angled1 = scl2([-deltaNrm[1], deltaNrm[0]], dot);
                let angled2 = scl2([-deltaNrm[1], deltaNrm[0]], -dot);
                // let len = len2(prevDeltaNrm);
                let lastTickness1 = !!last[2] ? last[2] : 2;
                let lastTickness2 = !!last[3] ? last[3] : lastTickness1;
                this.left.push(add2(last, scl2(angled1, lastTickness1)));
                this.right.unshift(add2(last, scl2(angled2, lastTickness2)));
            }
            this.points.push([...pos]);
        }
        getPath() {
		
			let prevLast = this.points[this.points.length - 3];
			let last = this.points[this.points.length - 2];
			let pos = this.points[this.points.length - 1];
			
			let prevDelta = sub2(prevLast, last);
			let prevDeltaNrm = nrm2(prevDelta);
			
			let delta = sub2(last, pos);
			let deltaNrm = nrm2(delta);
			
			let dot = dot2(deltaNrm, prevDeltaNrm);
			let angled1 = scl2([-deltaNrm[1], deltaNrm[0]], dot);
			let angled2 = scl2([-deltaNrm[1], deltaNrm[0]], -dot);
			// let len = len2(prevDeltaNrm);
			let lastTickness1 = !!pos[2] ? pos[2] : 2;
			let lastTickness2 = !!pos[3] ? pos[3] : lastTickness1;
			this.left.push(add2(pos, scl2(angled1, lastTickness1)));
			this.right.unshift(add2(pos, scl2(angled2, lastTickness2)));
		
            return [...this.left, ...this.right];
        }
    }
    
    return new Ribbon();
}

function scl2(a,b)   { return [a[0]*b, a[1]*b]; }
function add2(a,b)   { return [a[0]+b[0], a[1]+b[1]]; }
function sub2(a,b)   { return [a[0]-b[0], a[1]-b[1]]; }
function dot2(a,b)   { return a[0]*b[0] + a[1]*b[1]; }
function cross2(a,b) { return a[0]*b[1] - a[1]*b[0]; }
function len2(a)     { return Math.sqrt(a[0]**2 + a[1]**2); }
function dist2(a, b) { return len2(sub2(a,b)); }
function nrm2(a)     { return scl2(a, 1/len2(a)); }
function lrp2(a,b,f) { return [a[0]*f+b[0]*(1-f), a[1]*f+b[1]*(1-f)]; }
function lrp(a,b,f) { return a*f + b*(1-f); }
function eq(a,b) { return a[0] === b[0] && a[1] === b[1] }
function neq(a,b) { return !eq(a,b) }
function clamp(a, min = 0, max = 1) { return Math.min(max, Math.max(min, a)); }
function clamp01(a) { return clamp(a, 0, 1); }

function normalizePath(p, d = 0.5) {
	let wrap = eq(p[0], p[p.length-1]);
	let total = wrap ? p.length : p.length - 1;
    if (d <= 0) d = 0.001;
    const sub = [];
    for (let i=0; i < total; i++) {
        const p0 = p[(i+0) % p.length];
        const p1 = p[(i+1) % p.length];
        const l = Math.ceil(dist2(p0, p1) / d);
        for (let j=0; j<l; j++) {
            sub.push(lrp2(p0, p1, j/l));
        }
    }
    return sub;
}

function smoothPath(path, smoothness = 30) {
	let wrap = eq(path[0], path[path.length-1]);
    if (smoothness <= 1) return path;
    let prevPos = null;
    for (let smooth = 0; smooth < smoothness; smooth++) {
        let prevPos;
        let nextPos
        path.forEach((pos, idx) => {
            if (wrap) {
                prevPos = idx === 0 ? path[path.length-1] : path[idx-1];
                nextPos = idx === path.length-1 ? path[0] : path[idx+1];
            } else {
                prevPos = idx === 0 ? path[idx] : path[idx-1];
                nextPos = idx === path.length-1 ? path[path.length-1] : path[idx+1];
            }
            path[idx] = scl2(add2(add2(prevPos, pos), nextPos), 1/3);
        });
    }
    return path;
}

// pseudo random methods
function hash(p) {
    p += seed;
    p = 1103515245 * (((p) >> 1) ^ (p));
    p = 1103515245 * (p ^ (p>>3));
    p = p ^ (p >> 16);
    return p / 1103515245 % 1;	
}

function getGradientByType(rx, ry, type) {
    let r = 0;
    switch (type) {
		case 0:
            r = fxrand();
            break;
        case 1:
            r = (rx * ry) * 2;
            break;
        case 2:
            r = ((1 - rx) * ry) * 2;
            break;
        case 3:
            r = (rx * (1 - ry)) * 2;
            break;
        case 4:
            r = ((1 - rx) * (1 - ry)) * 2;
            break;
        case 5:
            r = rx;
            break;
        case 6:
            r = ry;
            break;
        default:
            r = (Math.pow(0.5 - rx, 2) + Math.pow(0.5 - ry, 2)) * 2;
            break;
    }
    return r;
}

function getPaletteValue(points, type, diffusion = 0, inverted = false) {
    var center = getShapeMiddle(points);
    let [rx, ry] = rotate(center, drawAngle);
    rx = clamp(getX(rx), 0.5, canvas.width - 0.5) / canvas.width;
    ry = clamp(getY(ry), 0.5, canvas.height - 0.5) / canvas.height;

    let r = getGradientByType(rx, ry, type);
	if (inverted) r = 1-r;
    return clamp01(r + (-0.5 + fxrand()) * diffusion);
}

function pickPalette(points, type, arr, diffusion = 0, inverted = false) {
	var r = getPaletteValue(points, type, diffusion, inverted);
    let value = Math.floor(r * (arr.length - 1));
    return arr[value];
}

let borderColor = pick(["black","white"]);
let drawBorders = fxrand() > 0.8;
function drawPoints(points, colors, globalAlpha = 1.0) {
	ctx.fillStyle = pickPalette(points, gradientType, colors, inverted, 0.4);
	ctx.globalAlpha = globalAlpha;
	ctx.strokeStyle = borderColor;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = getValue(3);
	
    ctx.beginPath();
	points.forEach((point,idx) => {
		let p = rotate(point, drawAngle);
		if (idx==0) ctx.moveTo(getX(p[0]), getY(p[1]));
		else ctx.lineTo(getX(p[0]), getY(p[1]));
	});
	ctx.closePath();
	if (drawBorders) ctx.stroke();
	ctx.fill();
}

window.onload = async () => {
	ctx.fillStyle = pick(colors);
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	
	let bgRGB = lightBackground ? '255,255,255' : '0,0,0';
	let solidBg = fxrand() > 0.5;
	ctx.fillStyle = solidBg ? `rgba(${bgRGB}, .85)` : `rgba(${bgRGB}, .85)`;
	ctx.fillRect(0,0,canvas.width,canvas.height);
	
	resetFxrand();
	
	ctx.globalCompositeOperation = 'source-over';
	
	await iterOnAnimationFrame(createShapes(ctx, totalRibbons), path => drawPoints(path, colors, 0.95));
	
	await drawDithering(canvas);
	
	addGrain(ditheredCanvas.getContext('2d'));
	
	let bgColor = ctx.getImageData(0,0,1,1).data;
	document.body.style.backgroundColor = `rgb(${bgColor[0]*0.9},${bgColor[1]*0.9},${bgColor[2]*0.9})`;

	window.$fxhashFeatures = {
		"preset": preset
	}
	console.log(window.$fxhashFeatures);
	
	fxpreview();
}

function addGrain(ctx) {
	ctx.save();
	ctx.globalAlpha = 0.1;
	let noiseSize = ctx.canvas.width/2;
	for(let _=0;_<3;_++)
	for(let y=range(-noiseSize,0);y<=ctx.canvas.height+noiseSize;y+=noiseSize) 
	for(let x=range(-noiseSize,0);x<=ctx.canvas.width+noiseSize;x+=noiseSize) {
		ctx.globalCompositeOperation = _%2 ==0 ? 'overlay' : 'darker';
		ctx.drawImage(grain,x,y, noiseSize,noiseSize);
	}
	ctx.restore();
}

function rotate(p, a) { return  [p[0]*Math.cos(a)+p[1]*Math.sin(a), p[1]*Math.cos(a)-p[0]*Math.sin(a)]; }
function getX(x) { return canvas.width * 0.5 + x * scale }
function getY(y) { return canvas.height * 0.5 + y * scale }
function getValue(value) { return value / 200 * canvas.width }
function range(min,max) { return min + fxrand() * (max-min); }
function pick(arr) {  return arr[fxrand() * arr.length | 0]; }
function getBrightnessFromRGB(r,g,b) { return (r+r+b+g+g+g) / 6 / 255; }
function getBrightnessFromImageData(pixels,idx = 0) { return getBrightnessFromRGB(pixels[idx+0], pixels[idx+1], pixels[idx+2]); }
function getBrightnessFromHex(hex) { let rgb = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex).map(v=>parseInt(v,16)); return getBrightnessFromRGB(rgb[1],rgb[2],rgb[3]) }
function clamp(v, min=0, max=255) { return v < min ? min : (v>max ? max : v); }
function lerp(a, b, v) { return a+(b-a)*v; }
function inverseLerp(a, b, v) { return clamp((v - a) / (b - a), 0.0, 1.0); }
function getShapeMiddle(shape) { return scl2(shape.reduce((curr,p) => curr = add2(curr, p), [0,0]), 1 / shape.length);}

function iterOnAnimationFrame(iterator, doStuff, steps = 100) {
	return new Promise(resolve => {
		function loop() {
			let iterations = steps;
			let result = iterator.next();
			while((!result.done && result.value) && iterations-- > 0) {
				doStuff(result.value);
				result = iterator.next();
			}
			if (!result.done && result.value) requestAnimationFrame(loop);
			else resolve();
		}
		loop();
	});
}
